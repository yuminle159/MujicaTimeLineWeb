<head>
  <meta charset="UTF-8">

  <title>Discography · 唯鸡百科</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;500;600;700&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=202609241342">
  <link rel="stylesheet" href="../css/discography-modal.css?v=202609241342">
  <link rel="stylesheet" href="../css/live-drawer.css?v=202609241342">
  <link rel="stylesheet" href="../css/song-modal.css?v=202609241342">
  <link rel="stylesheet" href="../css/interview-overlay.css?v=202609241342">
  <link rel="stylesheet" href="../css/local-search.css?v=202609241342">
  <link rel="stylesheet" href="../css/quick-nav.css?v=202609241342">
</head>
<body>
  <main class="discography-page">
    <header class="page-header">
      <a href="../index.html" class="back-nav" aria-label="返回主页">&larr;Home</a>
      <h1>Discography</h1>
      <p>实体发行作品目录</p>
    </header>

    <div class="toolbar" aria-label="唱片筛选">
      <div class="filter-group" id="filterGroup">
        <button class="main-tag active" data-filter="all"><span class="diamond">◆</span>全部</button>
        <button class="main-tag" data-filter="cd"><span class="diamond">◆</span>CD</button>
        <button class="main-tag" data-filter="blu-ray"><span class="diamond">◆</span>Blu-ray</button>
        <button class="main-tag" data-filter="lp"><span class="diamond">◆</span>LP</button>
        <button class="main-tag" data-filter="others"><span class="diamond">◆</span>Others</button>
      </div>
      <div class="search-box"><span class="search-icon">⌕</span><input id="searchInput" type="search" placeholder="搜索作品名称…"></div>
      <span class="result-count" id="resultCount"></span>
    </div>

    <section id="archive" class="archive" aria-live="polite"></section>
    <div id="noResults" class="no-results" hidden>没有找到匹配的发行作品</div>
  </main>

  <script src="../js/resource-error.js?v=202609241342"></script>
  <script src="data.js?v=202609241342"></script>

  <script src="page.js?v=202609241342"></script>

  <script src="../js/page-memory.js?v=202609241342"></script>
</body>
</html>
