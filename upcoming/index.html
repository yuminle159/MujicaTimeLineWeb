<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../favicon.ico">
  <title>Upcoming · 唯鸡百科</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Noto+Sans+SC:wght@300;400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=202610042357">
  <link rel="stylesheet" href="../css/quick-nav.css?v=202610042357">
</head>
<body>
  <main class="upcoming-page">
    <header class="upcoming-header">
      <a class="back-nav" href="../index.html" aria-label="返回主页">←Home</a>
      <p class="file-id">FILE // UPCOMING_SCHEDULE</p>
      <h1>Upcoming</h1>
      <p class="subtitle">RELEASES, PERFORMANCES &amp; EVENTS</p>
    </header>

    <section class="upcoming-shell" aria-label="未来档期">
      <div class="list-toolbar">
        <div class="type-filters" id="upcomingFilters" aria-label="类型筛选">
          <button class="active" type="button" data-type="all">全部</button>
          <button type="button" data-type="song">歌曲</button>
          <button type="button" data-type="live">演出</button>
          <button type="button" data-type="discography">实体发行物</button>
          <button type="button" data-type="animation">动画相关</button>
          <button type="button" data-type="activity">线上/线下活动</button>
        </div>
        <div class="list-meta">
          <span class="today-label" id="todayLabel"></span>
          <span class="list-count" id="upcomingCount"></span>
        </div>
      </div>
      <div class="upcoming-list" id="upcomingList"></div>
    </section>
  </main>

  <script src="../js/resource-error.js?v=202610042357"></script>
  <script src="events.js?v=202610042357"></script>
  <script src="page.js?v=202610042357"></script>
  <script src="../js/quick-nav.js?v=202610042357"></script>
  <script src="../js/page-memory.js?v=202610042357"></script>
</body>
</html>
