 <hgroup>
 <h2>Special</h2>
 <h3>＜インタビュー＞Ave MujicaのサウンドプロデューサーDiggy-MO’が考えるバンドプロデュースの真髄とは（前編）</h3>
 <ul>
 <font _mstmutation="1"><li _mstmutation="1"><a href="https://www.billboard-japan.com/artists/detail/4999">Diggy-MO'</a></li>
 <li _mstmutation="1"><a href="https://www.billboard-japan.com/artists/detail/1037111">Ave Mujica</a></li></font>
 </ul>
 </hgroup>
 
 <section>
 <div id="specialImport">
 <p>
 </p><div id="html_contents_1" style="display:none">
<script/>
<style>.c_artist1,.c_artist1{color:rgb(51,51,51)}.c_interviewer,.c_interviewer{color:rgb(114,101,76)}</style>
</div><div id="html_contents_2" style="display:none">
</div><div id="html_contents_3" style="display:none">
</div><div id="html_contents_4" style="display:block">
<div id="maintext">
<h5>人生で肝心なのは自分の中のワクワクと信念</h5>
 
<p class="c_interviewer">――そして2026年1月には、「令和7年アニソン大賞」で「KiLLKiSS」が大賞を受賞しました。同賞はこれまでLiSA、鈴木雅之 feat. 鈴木愛理、宇多田ヒカル、米津玄師、YOASOBI、Creepy Nutsが受賞しており、声優による楽曲が受賞したのは初のことでした。このラインナップを見ても、いわゆるアーティストと呼ばれる人たちが並んでいて、この中に入った事実は、先ほどからおっしゃっている“接続”が機能した結果の1つだと思います。</p>
<p><strong class="c_artist1">Diggy-MO’</strong>：ありがたいですし嬉しいです。みんなよかったねって。このプロジェクトが始まる前、Ave Mujicaに関しての僕へのオファー自体、“リアルなアーティストバンドを作りたい”っていうところで一応お聞きしていたし、常日頃から“もっとリアルバンドとしての姿勢も見せていきたい”っておっしゃっているメンバーたちもいたり。だから、コンテンツを大事にしつつ、その中でどうやってそういうことも引っ張っていくのかっていうミッションも僕的にはあったので、いろいろな意味でもよかったなって。</p>
<p class="c_interviewer">――現在、ただの声優バンドではないというところでのアピールが成功している中で、Ave Mujicaのメタルというパブリックイメージから、バンドで織り成すアートとしての提案が届き始めていると感じますか？</p>
<p><strong class="c_artist1">Diggy-MO’</strong>：うーん、そこまでは実際どうだろう……“バンドで織り成すアート”っていうところは最低10年くらいはかかるんじゃないかなぁ（笑）。</p>
 
<p class="c_interviewer">――アッハッハッハッ！</p>
<p><strong class="c_artist1">Diggy-MO’</strong>：アハハハ。受け手はどうしても最初は直接的な情報に傾倒するので、一部の人たち以外は、“Ave Mujicaはメタル”とか、“Diggyはラップ”とか？（笑）、正直ある程度そういう感じかなとは思います。ただ、まあそういうのも別に悪いわけではなくて、当たり前だとも思うし、“然り”なところもあるじゃないですか。だから、そういうこととも便利にうまく付き合いつつ、でも自分の信念がやることでもあるから、うまく度外視もしていくっていうか（笑）。</p>
 
 
<p class="c_interviewer">――それを受けて話は少し飛躍しますが、ジャンル別の論争なども昔からずっと絶えないですよね。Diggyさんはご自身の音楽をやる上で、そういうことをどのようにとらえていらっしゃいますか？</p>
<p><strong class="c_artist1">Diggy-MO’</strong>：まあ、背景とか歴史があってジャンルっていうもの自体が生まれると思うから、そこで主張されることって当然あるはずですよね。僕にも個人的な音楽ルーツはあるから、“自分の好きなジャンル感”みたいなのはあるし。ただ、論争については、そうですねぇ、……何かを作る時の主張と主張がぶつかり合うような、そういうクリエイティヴな感じとはまたちょっと別次元の話かなぁ。</p>
 
<p class="c_interviewer">――そうなんですよね。</p>
<p><strong class="c_artist1">Diggy-MO’</strong>：まあ人それぞれに信念があるわけだから、自分にとっては、それってけっこう興味深いっていうか。あくまで僕の場合ですけど、互いの価値観について論破し合うより、自分と違う価値観から何か学べるものがないかを探したいかなって。そういう学びにしても、それって必ずしも直接そのものからだけではないこともたくさんあるんですよね。人物とか背景とか、それにまつわるいろいろから、何か自分が知らないこととか、吸収できるものとか、いっぱいありそうっていうか。そういうのをよく見たいし、なんでも自分のイマジネーションにしたいですね。やっぱり“その人を知る”って大切だと思うんですよ。僕の場合、自分の表現を極めるために、そういうことのほうに貪欲でありたいっていう感じで。だから、たとえば相手側の話を聞けるだけでもけっこう面白いんじゃないかなぁ。時どきで“へぇ！”みたいな（笑）。</p>
 
<p class="c_interviewer">――めちゃくちゃ納得してしまいますね。そもそもDiggyさんの表現するものの中には、総合芸術として完成されているものもあるし、あえてジャンルに特化しているものもあって、本当にさまざまなバラエティに富んでいる。でも、そのすべてにDiggy-MO’の芸術における美学という一貫性がちゃんと見える。</p>
<p><strong class="c_artist1">Diggy-MO’</strong>：自分の中にある“音楽的ってどういうことか”みたいな解釈も、やっぱり常に更新していたいし、そういうのが豊かになっていくと単純に楽しいんですよね。追求すればするほど興味が湧くものもより出てくるし。だから、何よりも自分の好奇心に正直に、自分の信じる新しさとか、自分の信じる質の高さとか、そういう音楽を勝手にじゃんじゃん生み出していって、で、もし機会があるのであれば披露していきたいなっていう感じなんですよ（笑）。</p>
 
 
<p class="c_interviewer">――今のお話は、本当にDiggy-MO’がDiggy-MO’である所以だと痛感しますね。そして変な話ですが、Diggyさんのそういう姿勢自体も、話題性や面白さも含めて1つのエンタメにもなってしまうという。</p>
<p><strong class="c_artist1">Diggy-MO’</strong>：そんなこともありますかね（笑）。まあ、目指すものに没頭できるって幸せじゃないですか。なんでも十分に時間をかけて、まずは自分が吟味しながら楽しみたいし、その先に、ご縁があった人に喜んでもらいたいですよね。</p>
 
<p class="c_interviewer">――時代の変化や情報の中で価値観の変動もあって、表現者はさまざまな状況下に立たされる。そういう意味でもブレない姿勢は貴重な価値になると思います。</p>
<p><strong class="c_artist1">Diggy-MO’</strong>：まあそうですね。もちろん時に失敗したり、うまくいかなかったりすることだってあると思うんですよ。でも、変な勘違いはしたくないですし、やっぱり常に初心も忘れるべからずだったり。で、あとの評価とかよしなし事っていうのは、ありがたく受け取る一方で、どこかで面白がれればいいっていうのも。いろいろな考えの人もいて、イメージもあったり、不条理なルールとか、大義名分とか（笑）？　真実なんてそれらしくなんか見えないし、結局全部ひっくるめてになってきますから。だから、そういうゲーム性の強いものに振り回されちゃいけないんですよね。人生で肝心なのって、自分の中のワクワクとか、あとはやっぱり信念かなって。</p>
 
<p class="c_interviewer">――いやあ、本当にそうなんですよね。Diggyさんのアーティストとしてのキャリアや、その鋭い洞察眼を持ってやられてきているプロデュースワークの軌跡を思うと、とても大切な重い言葉です。また、話をAve Mujicaに戻しますが、【Ave Mujica LIVE TOUR 2026「Exitus」】の会場では、Diggyさんによる仮歌mixのオリジナルバージョン『Sophie / ‘S/’ The Way -ver.D-』も販売されていました。ライブ会場限定とはいえ、やはりその内容は素晴らしい。こういった企画はなかなか斬新なアプローチでもありましたよね？</p>
<p><strong class="c_artist1">Diggy-MO'</strong>：スタッフ間での食事会でそんな話が出たって聞いたんですよ。“へぇ、そうなんだ”みたいな（笑）。まあ僕自体、経歴的に完全な裏方っていう認知のされ方ではないでしょうから、1つのフックとして多少なり話題性を作れればいいんじゃないかなっていう感じでしたね。</p>
<p class="c_interviewer">――SNSなどで、Diggyさん自身からのアピールはそこまでなかった印象ですが、あえて？</p>
<p><strong class="c_artist1">Diggy-MO’</strong>：まあ、ある程度でいいかなって（笑）。何かしら作用して“全部バンドに繋がっていくなら”っていう真意があらぬ方向に行かなければ、こういうのも楽しいよねっていう感じですね。</p>
 
<p class="c_interviewer">――音源は最高でしたし、聴きたい人もめちゃくちゃ多かったと思います。企画としてもとても面白いと思いましたよ。またやってほしいという意見もたくさんありましたし。</p>
<p><strong class="c_artist1">Diggy-MO’</strong>：うん、もちろんそういうのは嬉しいですよね。ありがたいなって。</p>
<br/>
<p>（<a href="https://www.billboard-japan.com/special/detail/5517" target="_blank">中編</a>は11月11日（水）19:00に公開）</p><br/>

<dl>
<h9>Diggy-MO’（ディギー・モー）</h9><br/>
<p>1999年SOUL'd OUT結成。2003年「ウェカピポ」でメジャーデビュー。2007年「武道館ライブ」。2008年ソロ始動「爆走夢歌」「JUVES」等ヒットを放ち、2009年1st AL「Diggyism」をリリース。2014年グループ解散。2018年ソロ10周年ベスト「DX - 10th Anniversary All This Time 2008-2018 -」を発表。2019年「ヒプノシスマイク」に楽曲提供し、以降プロデュース業でもその手腕を発揮する。また海外映画作品の日本語版制作において数々の挿入歌の訳詞等も手掛けていく。「ピーターラビット」、「ペット2」、「シング・フォー・ミー、ライル」、そして2024年にはディズニー映画「モアナと伝説の海2」の全新曲挿入歌の訳詞を担当し、話題を呼んだ。2026年「m-flo loves Diggy-MO’ &amp; しのだりょうすけ / GateWay」にてゲスト参加、MV等でも旋風を巻き起こす。同年ロッテ・クランキーのCMにてグループ時代の「ウェカピポ」が起用され、渡辺直美ら出演の中、Diggy本人を模した人形も登場するなど盛り上がりを見せた。現在「BanG Dream!」内のバンド「Ave Mujica」の音楽プロデューサーを務め、全作詞・作編曲およびライブプロデュースまで、バンド演出の核となるすべてを手掛けている。</p>
</dl>
