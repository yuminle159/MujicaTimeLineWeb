<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>事件时间轴</title>
  <link rel="stylesheet" href="style.css?v=26">
</head>
<body>
  <div class="timeline-page">
    <header class="page-header">
      <h1>Ave Mujica TimeLine</h1>
      <p>Band &amp; Nonrico</p>
    </header>

    <div class="timeline-wrapper" id="timelineWrapper">
      <!-- 左侧月度刻度 -->
      <div class="ticks-left" id="ticksLeft"></div>
      <!-- 右侧月度刻度 -->
      <div class="ticks-right" id="ticksRight"></div>

      <!-- 左侧：组织 -->
      <div class="track track-left" id="trackLeft"></div>

      <!-- 右侧：个人 -->
      <div class="track track-right" id="trackRight"></div>
    </div>
  </div>

  <script src="data.js?v=4"></script>
  <script>
(function () {
  const PD = timelineConfig.pixelsPerDay;
  const START_TOP = 80;

  const trackL = document.getElementById("trackLeft");
  const trackR = document.getElementById("trackRight");
  const ticksL = document.getElementById("ticksLeft");
  const ticksR = document.getElementById("ticksRight");
  const wrapper = document.getElementById("timelineWrapper");

  const FM = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

  function daysBetween(d1, d2) {
    return Math.round((d2 - d1) / 86400000);
  }

  const startDate = timelineData.reduce((min, e) => {
    const d = new Date(e.date); return d < min ? d : min;
  }, new Date(timelineData[0]?.date || timelineConfig.zeroDate));

  const endDate = timelineData.reduce((max, e) => {
    const d = new Date(e.date); return d > max ? d : max;
  }, new Date(timelineData[0]?.date || timelineConfig.zeroDate));

  function calcTop(dateStr) {
    return START_TOP + daysBetween(startDate, new Date(dateStr)) * PD;
  }

  const YEAR_LABEL_GAP = 60; // 年份标签与月份刻度的间距（px），可自行调整

  // 生成月度刻度（统一短轴）+ 年份标签（每年第一个月份上方）
  // monthMaps = { left: {...}, right: {...} }，左右轨独立
  const allTicks = [];
  const yearLabels = [];
  function generateMonthTicks(monthMaps) {
    function buildSide(ticksContainer, monthMap, side) {
      const sortedMonths = Object.keys(monthMap).sort();
      let lastYear = null;
      let prevMax = -Infinity;

      sortedMonths.forEach((mk) => {
        // 确保当前刻度位置 >= 上个月最后事件位置 + 间距
        let tickTop = Math.max(monthMap[mk].minTop, prevMax + MIN_GAP);
        prevMax = monthMap[mk].maxTop;
        const [y, m] = mk.split('-');
        const monthNum = parseInt(m);
        const year = parseInt(y);
        const label = FM[monthNum - 1];

        // 新年份：在第一个月份刻度上方插入年份标签
        if (year !== lastYear) {
          lastYear = year;
          const yearTop = tickTop - YEAR_LABEL_GAP;
          const yl = document.createElement("div");
          yl.className = "year-label";
          yl.style.top = yearTop + "px";
          yl.textContent = String(year);
          yl.dataset.originalTop = yearTop;
          yl.dataset.side = side;
          ticksContainer.appendChild(yl);
          yearLabels.push(yl);
        }

        const t = document.createElement("div");
        t.className = "tick";
        t.style.top = tickTop + "px";
        t.dataset.originalTop = tickTop;
        t.dataset.side = side;
        if (side === 'left') {
          t.innerHTML = `<span class="tick-line"></span><span class="tick-label">${label}</span>`;
        } else {
          t.innerHTML = `<span class="tick-label">${label}</span><span class="tick-line"></span>`;
        }
        ticksContainer.appendChild(t);
        allTicks.push(t);
      });
    }

    buildSide(ticksL, monthMaps.left, 'left');
    buildSide(ticksR, monthMaps.right, 'right');
  }

  // 渲染媒体
  function mediaHTML(m) {
    if (m.type === "image") {
      const cap = m.caption ? `<div class="mc">${m.caption.replace(/\n/g, "<br>")}</div>` : "";
      return `<div><img src="${m.src}" alt="${m.caption||""}" loading="lazy">${cap}</div>`;
    }
    if (m.type === "video") {
      return `<iframe src="${m.src}" allowfullscreen loading="lazy"></iframe>`;
    }
    if (m.type === "link") {
      return `<a class="ext-link" href="${m.url}" target="_blank" rel="noopener">${m.title||m.url}</a>`;
    }
    return "";
  }

  // 多图轮播组件
  function renderCarousel(images) {
    const imgs = images.map((img, i) =>
      `<img src="${img.src}" alt="${img.caption||""}" class="carousel-img${i === 0 ? ' active' : ''}" loading="lazy" data-index="${i}">`
    ).join("");
    return `
      <div class="carousel" data-current="0" data-total="${images.length}">
        <div class="carousel-imgs">${imgs}</div>
        <button class="carousel-arrow carousel-prev">&#8249;</button>
        <button class="carousel-arrow carousel-next">&#8250;</button>
        <div class="carousel-counter">1 / ${images.length}</div>
        <div class="carousel-caption">${images[0].caption || ""}</div>
      </div>`;
  }

  // 多视频轮播组件
  function renderVideoCarousel(videos) {
    const items = videos.map((v, i) =>
      `<iframe src="${i === 0 ? v.src : ''}" data-src="${v.src}" data-caption="${v.caption || ''}" class="carousel-video${i === 0 ? ' active' : ''}" allowfullscreen loading="lazy" data-index="${i}"></iframe>`
    ).join("");
    return `
      <div class="carousel" data-current="0" data-total="${videos.length}">
        <div class="carousel-imgs">${items}</div>
        <button class="carousel-arrow carousel-prev">&#8249;</button>
        <button class="carousel-arrow carousel-next">&#8250;</button>
        <div class="carousel-counter">1 / ${videos.length}</div>
        <div class="carousel-caption">${videos[0].caption || ""}</div>
      </div>`;
  }

  // tag 到 icon 的映射（icons/ 文件夹下）
  const TAG_ICONS = {
    // 组织相关
    live: "icons/live.png",
    single: "icons/single.png",
    album: "icons/album.png",
    anime: "icons/anime.png",
    offline: "icons/offline.png",
    // 个人相关
    private: "icons/private.png",
    business: "icons/business.png"
  };

  // 创建事件
  timelineData.forEach((ev, idx) => {
    const isOrg = ev.category === "organization";
    const track = isOrg ? trackL : trackR;
    const top = calcTop(ev.date);
    const d = new Date(ev.date);
    const monthKey = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');

    const group = document.createElement("div");
    group.className = "event-group " + (isOrg ? "org" : "per");
    // 不在创建时设 style.top，由 resolveOverlaps 统一设置（避免初始过渡动画）
    group.dataset.originalTop = top;
    group.dataset.monthKey = monthKey;
    group.dataset.index = idx;
    group.dataset.category = ev.category;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    const tagIcon = ev.tag && TAG_ICONS[ev.tag] ? `<img class="tag-icon" src="${TAG_ICONS[ev.tag]}" alt="${ev.tag}" data-tag="${ev.tag}">` : "";
    bubble.innerHTML = `<div class="b-date">${ev.date}</div><div class="b-title">${ev.title}</div>${tagIcon}`;
    bubble.onclick = function () {
      const g = this.closest(".event-group");
      const d = g.querySelector(".detail");
      const wasOpen = d.classList.contains("open");

      // 关闭所有已展开的
      document.querySelectorAll(".event-group.expanded").forEach(eg => {
        eg.classList.remove("expanded");
        eg.style.zIndex = "3";
      });
      document.querySelectorAll(".detail.open").forEach(x => x.classList.remove("open"));

      if (!wasOpen) {
        d.classList.add("open");
        g.classList.add("expanded");
        g.style.zIndex = "100";
      }

      updatePositions();
    };

    const detail = document.createElement("div");
    detail.className = "detail";
    const mediaItems = ev.media || [];
    const imageItems = mediaItems.filter(m => m.type === "image");
    const videoItems = mediaItems.filter(m => m.type === "video");
    const linkItems = mediaItems.filter(m => m.type === "link");

    // 多图/多视频 → 轮播；单图/单视频/链接 → 普通渲染
    let mediaParts = [];
    if (imageItems.length > 1) {
      mediaParts.push(renderCarousel(imageItems));
    } else {
      imageItems.forEach(m => mediaParts.push(mediaHTML(m)));
    }
    if (videoItems.length > 1) {
      mediaParts.push(renderVideoCarousel(videoItems));
    } else {
      videoItems.forEach(m => mediaParts.push(mediaHTML(m)));
    }
    // 链接始终显示在图片/视频下方
    linkItems.forEach(m => mediaParts.push(mediaHTML(m)));

    const mediaContent = mediaParts.length ? '<div class="d-media">' + mediaParts.join("") + '</div>' : "";
    detail.innerHTML = `<div class="d-desc">${ev.description.replace(/\n/g, "<br>")}</div>${mediaContent}`;
    // 图片加载完成后重新计算撑开量（height:auto 的图片在加载前高度为 0）
    detail.querySelectorAll("img").forEach(img => {
      if (!img.complete) {
        img.addEventListener("load", () => {
          if (detail.classList.contains("open")) updatePositions();
        });
      }
    });

    const connector = document.createElement("div");
    connector.className = "connector";

    const spacer = document.createElement("div");
    spacer.className = "spacer";

    const eventWrap = document.createElement("div");
    eventWrap.className = "event-wrap";
    eventWrap.appendChild(connector);
    eventWrap.appendChild(bubble);
    eventWrap.appendChild(spacer);

    group.appendChild(eventWrap);
    group.appendChild(detail);
    track.appendChild(group);
  });

  // 相邻事件间距不足时自动错开，避免气泡重叠
  // 返回 { left: monthMapL, right: monthMapR }，左右轨独立
  const MIN_GAP = 10; // 事件之间的最小间距（px），可自行调整
  function resolveOverlaps() {
    const result = { left: {}, right: {} };

    [
      { track: trackL, key: 'left' },
      { track: trackR, key: 'right' }
    ].forEach(({ track, key }) => {
      const monthMap = {};
      const groups = Array.from(track.querySelectorAll('.event-group'));
      groups.sort((a, b) => parseFloat(a.dataset.originalTop) - parseFloat(b.dataset.originalTop));

      let lastBottom = -Infinity;
      groups.forEach(g => {
        const origTop = parseFloat(g.dataset.originalTop);
        const groupHeight = g.offsetHeight;
        const mk = g.dataset.monthKey;

        let baseTop;
        if (origTop < lastBottom + MIN_GAP) {
          baseTop = lastBottom + MIN_GAP;
        } else {
          baseTop = origTop;
        }

        g.dataset.baseTop = baseTop;
        g.style.top = baseTop + 'px';
        lastBottom = baseTop + groupHeight;

        if (!monthMap[mk]) monthMap[mk] = { minTop: Infinity, maxTop: -Infinity };
        if (baseTop < monthMap[mk].minTop) monthMap[mk].minTop = baseTop;
        if (baseTop > monthMap[mk].maxTop) monthMap[mk].maxTop = baseTop;
      });

      result[key] = monthMap;
    });

    return result;
  }

  // 获取详情框在展开宽度下的真实内容高度
  function getExpandedHeight(detail) {
    const expandedWidth = getComputedStyle(document.documentElement).getPropertyValue('--detail-expanded-width').trim();
    // 保存原始内联样式
    const origTransition = detail.style.transition;
    const origWidth = detail.style.width;
    const origMaxHeight = detail.style.maxHeight;
    const origOverflow = detail.style.overflow;
    const origPadding = detail.style.padding;
    // 关键：先禁用 CSS transition，确保下面设置的值瞬间生效，不会在过渡中间态测量
    detail.style.transition = 'none';
    detail.style.width = expandedWidth;
    detail.style.maxHeight = 'none';
    detail.style.overflow = 'visible';
    detail.style.padding = '18px'; // 展开态 padding，确保 scrollHeight 包含 padding
    detail.offsetHeight; // 强制 reflow，此时宽度已瞬间变为展开宽度
    const h = detail.scrollHeight;
    // 恢复原始内联样式
    detail.style.transition = origTransition;
    detail.style.width = origWidth;
    detail.style.maxHeight = origMaxHeight;
    detail.style.overflow = origOverflow;
    detail.style.padding = origPadding;
    detail.offsetHeight; // 再触发一次 reflow，让 CSS transition 从正确状态重新开始
    return h;
  }

  // 更新所有事件 + 刻度位置
  function updatePositions() {
    const allGroups = [
      ...Array.from(trackL.querySelectorAll(".event-group")),
      ...Array.from(trackR.querySelectorAll(".event-group"))
    ];
    // 用 baseTop 排序（含重叠偏移）
    allGroups.sort((a, b) => (parseFloat(a.dataset.baseTop) || parseFloat(a.dataset.originalTop)) - (parseFloat(b.dataset.baseTop) || parseFloat(b.dataset.originalTop)));

    let offset = 0;
    allGroups.forEach(g => {
      const baseTop = parseFloat(g.dataset.baseTop) || parseFloat(g.dataset.originalTop);
      const detail = g.querySelector(".detail");
      const isOpen = detail && detail.classList.contains("open");

      g.style.top = (baseTop + offset) + "px";

      if (isOpen) {
        // 在展开宽度下测量真实内容高度，确保宽屏/窄屏都准确
        offset += getExpandedHeight(detail) + 24;
      }
    });

    // 对齐详情框与气泡：测量 connector 宽度设置 margin
    allGroups.forEach(g => {
      const connector = g.querySelector(".connector");
      const detail = g.querySelector(".detail");
      if (connector && detail) {
        const cw = connector.offsetWidth;
        if (g.classList.contains("org")) {
          detail.style.marginLeft = cw + "px";
          detail.style.marginRight = "0";
        } else {
          detail.style.marginRight = cw + "px";
          detail.style.marginLeft = "0";
        }
      }
    });

    // 同步刻度位置（比较基于事件的实际 baseTop，确保刻度与事件对齐）
    allTicks.forEach(t => {
      const tickBaseTop = parseFloat(t.dataset.originalTop);
      let tickOffset = 0;
      allGroups.forEach(g => {
        const gBaseTop = parseFloat(g.dataset.baseTop) || parseFloat(g.dataset.originalTop);
        if (gBaseTop < tickBaseTop) {
          const detail = g.querySelector(".detail");
          if (detail && detail.classList.contains("open")) {
            tickOffset += getExpandedHeight(detail) + 24;
          }
        }
      });
      t.style.top = (tickBaseTop + tickOffset) + "px";
    });

    // 同步年份标签位置
    yearLabels.forEach(yl => {
      const ylBaseTop = parseFloat(yl.dataset.originalTop);
      let ylOffset = 0;
      allGroups.forEach(g => {
        const gBaseTop = parseFloat(g.dataset.baseTop) || parseFloat(g.dataset.originalTop);
        if (gBaseTop < ylBaseTop) {
          const detail = g.querySelector(".detail");
          if (detail && detail.classList.contains("open")) {
            ylOffset += getExpandedHeight(detail) + 24;
          }
        }
      });
      yl.style.top = (ylBaseTop + ylOffset) + "px";
    });

    // 调整容器高度
    requestAnimationFrame(() => {
      let maxH = 600;
      [trackL, trackR].forEach(track => {
        track.querySelectorAll(".event-group").forEach(g => {
          const b = g.offsetTop + g.offsetHeight;
          if (b > maxH) maxH = b;
        });
      });
      wrapper.style.minHeight = (maxH + 80) + "px";
      ticksL.style.height = (maxH + 80) + "px";
      ticksR.style.height = (maxH + 80) + "px";
    });
  }

  // 轮播交互：事件委托，箭头切换图片/视频
  wrapper.addEventListener("click", function(e) {
    const btn = e.target.closest(".carousel-arrow");
    if (!btn) return;
    e.stopPropagation();

    const carousel = btn.closest(".carousel");
    const dir = btn.classList.contains("carousel-prev") ? -1 : 1;
    const items = carousel.querySelectorAll(".carousel-img, .carousel-video");
    const total = items.length;
    let current = parseInt(carousel.dataset.current);

    items[current].classList.remove("active");
    current = (current + dir + total) % total;
    const activeItem = items[current];
    activeItem.classList.add("active");

    // 视频：重置 src 强制从头播放；非活跃视频不加载（src 为空）
    if (activeItem.tagName === "IFRAME") {
      activeItem.src = activeItem.dataset.src;
    }

    carousel.querySelector(".carousel-counter").textContent = (current + 1) + " / " + total;
    const caption = activeItem.dataset.caption || activeItem.alt || "";
    carousel.querySelector(".carousel-caption").textContent = caption;
    carousel.dataset.current = current;

    // 切换后重算撑开量
    const detail = carousel.closest(".detail");
    if (detail && detail.classList.contains("open")) {
      updatePositions();
    }
  });

  // 初始布局：禁用过渡动画，防止页面加载时出现下移特效
  document.querySelectorAll('.event-group, .tick').forEach(el => { el.style.transition = 'none'; });

  const monthMaps = resolveOverlaps();
  generateMonthTicks(monthMaps);
  updatePositions();

  // 布局完成后恢复过渡动画
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      document.querySelectorAll('.event-group, .tick').forEach(el => { el.style.transition = ''; });
    });
  });
})();
  </script>
</body>
</html>
