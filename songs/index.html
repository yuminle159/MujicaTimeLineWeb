<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../favicon.ico">
  <title>Songs · 唯鸡百科</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=202609200002">
  <link rel="stylesheet" href="../css/song-modal.css?v=202609200002">
  <link rel="stylesheet" href="../css/live-drawer.css?v=202609200002">
  <link rel="stylesheet" href="../css/discography-modal.css?v=202609200002">
  <link rel="stylesheet" href="../css/interview-overlay.css?v=202609200002">
  <link rel="stylesheet" href="../css/local-search.css?v=202609200002">
</head>
<body>
  <div class="songs-page">
    <header class="page-header">
      <a href="../index.html" class="back-nav">&larr; 返回主页</a>
      <h1>Songs</h1>
    </header>

    <section class="new-release-spotlight" id="newReleaseSpotlight" aria-label="新曲发布" hidden></section>

    <!-- 工具栏 -->
    <div class="toolbar">
      <div class="filter-group">
        <button class="main-tag" id="filterOriginal" data-type="Original">
          <span class="diamond">◆</span> 仅显示原创
        </button>
        <button class="main-tag" id="filterCover" data-type="Cover">
          <span class="diamond">◆</span> 仅显示翻唱
        </button>
      </div>
      <div class="separator"></div>
      <div class="search-box">
        <span class="search-icon">&#128269;</span>
        <input type="text" id="searchInput" placeholder="搜索歌名...">
      </div>
      <span class="result-count" id="resultCount"></span>
      <button class="lyrics-atlas-trigger" id="lyricsAtlasTrigger" type="button">Lyrics Atlas</button>
      <button class="sort-btn" id="sortBtn">
        <span id="sortLabel">时间倒序</span>
      </button>
    </div>

    <!-- 画廊主体 -->
    <div id="gallery"></div>

    <!-- 无结果 -->
    <div class="no-results" id="noResults" style="display:none">没有找到匹配的歌曲</div>

    <button class="songs-page-top-btn" id="songsPageTopBtn" type="button" aria-label="返回页面顶部">↑ Page Top</button>
  </div>

  <script src="data.js?v=202609200002"></script>
  <script src="../discography/data.js?v=202609200002"></script>
  <script src="../live/data.js?v=202609200002"></script>
  <script src="../interview/data.js?v=202609200002"></script>
  <script src="../js/renderMarkdown.js?v=202609200002"></script>
  <script src="../js/overlay-manager.js?v=202609200002"></script>
  <script src="../js/interview-overlay.js?v=202609200002"></script>
  <script src="../js/song-modal.js?v=202609200002"></script>
  <script src="../js/live-drawer.js?v=202609200002"></script>
  <script src="../js/discography-modal.js?v=202609200002"></script>
  <script src="lyrics-atlas-data.js?v=202609200002"></script>
  <script>
(function() {
  let sortAsc = true;  // 默认：时间正序（旧→新）
  let searchQuery = "";
  let activeType = null;  // null | "Original" | "Cover"
  const NEW_RELEASE_WINDOW_DAYS = 14;
  let newReleaseRotationTimer;
  let newReleaseTransitionTimer;

  // ===== 类型筛选按钮 =====
  document.getElementById("filterOriginal").addEventListener("click", function() {
    if (activeType === "Original") {
      activeType = null;
      this.classList.remove("active");
    } else {
      activeType = "Original";
      this.classList.add("active");
      document.getElementById("filterCover").classList.remove("active");
    }
    renderGallery();
  });
  document.getElementById("filterCover").addEventListener("click", function() {
    if (activeType === "Cover") {
      activeType = null;
      this.classList.remove("active");
    } else {
      activeType = "Cover";
      this.classList.add("active");
      document.getElementById("filterOriginal").classList.remove("active");
    }
    renderGallery();
  });

  // ===== 按年份分组 =====
  function groupByYear() {
    const map = {};
    songsData.forEach(song => {
      const year = (song.release_date || "").substring(0, 4) || "未分类";
      if (!map[year]) map[year] = { year, songs: [] };
      map[year].songs.push(song);
    });
    let years = Object.values(map);
    years.sort((a, b) => {
      const ya = parseInt(a.year) || 0;
      const yb = parseInt(b.year) || 0;
      return sortAsc ? ya - yb : yb - ya;
    });
    return years;
  }

  function filterSongs(songs) {
    let filtered = songs;
    if (activeType) {
      filtered = filtered.filter(s => s.type === activeType);
    }
    if (!searchQuery) return filtered;
    const q = searchQuery.toLowerCase();
    return filtered.filter(s => {
      return s.name.toLowerCase().includes(q) ||
             (s.name_jp && s.name_jp.toLowerCase().includes(q)) ||
             (s.search_keywords && s.search_keywords.toLowerCase().includes(q));
    });
  }

  const gallery = document.getElementById("gallery");
  const noResults = document.getElementById("noResults");
  const resultCount = document.getElementById("resultCount");
  const newReleaseSpotlight = document.getElementById("newReleaseSpotlight");
  const JAPAN_OFFSET_MS = 9 * 60 * 60 * 1000;

  function releaseTimestamp(dateStr) {
    const match = String(dateStr || "").match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
    return match ? Date.UTC(Number(match[1]), Number(match[2]) - 1, Number(match[3])) : 0;
  }

  function todayTimestamp() {
    const today = new Date(Date.now() + JAPAN_OFFSET_MS);
    return Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), today.getUTCDate());
  }

  function isNewRelease(song) {
    const releasedAt = releaseTimestamp(song.release_date);
    const age = todayTimestamp() - releasedAt;
    return releasedAt && age >= 0 && age <= NEW_RELEASE_WINDOW_DAYS * 86400000;
  }

  function daysUntilRelease(song) {
    const releasedAt = releaseTimestamp(song.release_date);
    const days = Math.ceil((releasedAt - todayTimestamp()) / 86400000);
    return releasedAt && days > 0 ? days : null;
  }

  function renderReleaseSpotlightCard(releases, activeIndex) {
    const newRelease = releases[activeIndex];
    const index = songsData.indexOf(newRelease);
    const pager = releases.length > 1
      ? `<span class="new-release-pager" aria-hidden="true">${String(activeIndex + 1).padStart(2, "0")} / ${String(releases.length).padStart(2, "0")}</span>`
      : "";
    newReleaseSpotlight.innerHTML = `
      <button class="new-release-card is-rotating" type="button" data-song-index="${index}" aria-label="查看新曲 ${escapeHTML(newRelease.name_jp || newRelease.name)} 的详情">
        <span class="new-release-visual" aria-hidden="true">
          ${newRelease.cover ? `<img src="${escapeHTML(newRelease.cover)}" alt="">` : '<span class="new-release-visual-placeholder"></span>'}
        </span>
        <span class="new-release-content">
          <span class="new-release-kicker"><i></i> NEW RELEASE // ${escapeHTML(stripTime(newRelease.release_date))}</span>
          <strong class="new-release-title">${escapeHTML(newRelease.name_jp || newRelease.name)}</strong>
          ${newRelease.name ? `<span class="new-release-subtitle">${escapeHTML(newRelease.name)}</span>` : ""}
          <span class="new-release-open">EXPLORE SONG <b aria-hidden="true">↗</b></span>
        </span>
        <span class="new-release-seal" aria-hidden="true">NEW<br>SONG</span>
        ${pager}
      </button>`;
  }

  function renderNewReleaseSpotlight() {
    const releases = songsData
      .filter(isNewRelease)
      .sort((a, b) => releaseTimestamp(b.release_date) - releaseTimestamp(a.release_date));
    window.clearInterval(newReleaseRotationTimer);
    window.clearTimeout(newReleaseTransitionTimer);
    if (!releases.length) {
      newReleaseSpotlight.hidden = true;
      newReleaseSpotlight.innerHTML = "";
      newReleaseSpotlight.onmouseenter = null;
      newReleaseSpotlight.onmouseleave = null;
      return;
    }

    newReleaseSpotlight.hidden = false;
    let activeIndex = 0;
    renderReleaseSpotlightCard(releases, activeIndex);
    function rotateRelease() {
      const card = newReleaseSpotlight.querySelector(".new-release-card");
      const showNext = function() {
        activeIndex = (activeIndex + 1) % releases.length;
        renderReleaseSpotlightCard(releases, activeIndex);
        newReleaseTransitionTimer = undefined;
      };
      if (!card) {
        showNext();
        return;
      }
      card.classList.add("is-leaving");
      newReleaseTransitionTimer = window.setTimeout(showNext, 420);
    }
    function pauseReleaseRotation() {
      window.clearInterval(newReleaseRotationTimer);
      window.clearTimeout(newReleaseTransitionTimer);
      newReleaseSpotlight.querySelector(".new-release-card")?.classList.remove("is-leaving");
    }
    function resumeReleaseRotation() {
      if (releases.length < 2) return;
      window.clearInterval(newReleaseRotationTimer);
      newReleaseRotationTimer = window.setInterval(rotateRelease, 6000);
    }
    if (releases.length > 1) {
      newReleaseSpotlight.onmouseenter = pauseReleaseRotation;
      newReleaseSpotlight.onmouseleave = resumeReleaseRotation;
      resumeReleaseRotation();
    } else {
      newReleaseSpotlight.onmouseenter = null;
      newReleaseSpotlight.onmouseleave = null;
    }
  }

  function renderGallery() {
    gallery.innerHTML = "";
    let totalVisible = 0;
    const years = groupByYear();

    years.forEach(year => {
      const filtered = filterSongs(year.songs);
      filtered.sort((a, b) => {
        const da = parseDate(a.release_date);
        const db = parseDate(b.release_date);
        return sortAsc ? da - db : db - da;
      });
      if (filtered.length === 0) return;
      totalVisible += filtered.length;

      const section = document.createElement("div");
      section.className = "album-section";
      section.innerHTML = `
        <div class="album-divider">
          <span class="album-name">${escapeHTML(year.year)}</span>
        </div>
        <div class="cover-grid">
          ${filtered.map(s => renderCoverCard(s)).join("")}
        </div>`;
      gallery.appendChild(section);
    });

    noResults.style.display = totalVisible === 0 ? "block" : "none";
    resultCount.textContent = totalVisible > 0 ? `共 ${totalVisible} 首` : "";
  }

  function escapeHTML(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
  function stripTime(dateStr) {
    // 去除 00:00:00 等时间部分，保留 YYYY-MM-DD 或 YYYY/M/D
    return dateStr.replace(/\s[\d:]+$/, "").trim();
  }
  function parseDate(str) {
    if (!str) return 0;
    // 支持 2023/5/7、2023-05-07、2023/05/07 等格式
    const parts = str.split(/[\/\-]/);
    if (parts.length < 3) return 0;
    const y = parseInt(parts[0]) || 0;
    const m = parseInt(parts[1]) || 0;
    const d = parseInt(parts[2]) || 0;
    return y * 10000 + m * 100 + d;
  }

  function renderCoverCard(song) {
    const coverSrc = song.cover || "";
    const jp = song.name_jp ? `<span class="cover-song-name">${escapeHTML(song.name_jp)}</span>` : "";
    const cn = song.name ? `<span class="cover-song-name-cn">${escapeHTML(song.name)}</span>` : "";
    const countdownDays = daysUntilRelease(song);
    const releaseBadge = isNewRelease(song)
      ? '<span class="cover-new-badge">NEW</span>'
      : (countdownDays ? `<span class="cover-countdown-badge">${countdownDays} 天后</span>` : "");
    return `
      <div class="cover-card type-${(song.type || '').toLowerCase()}${countdownDays ? ' is-upcoming' : ''}" data-song-index="${songsData.indexOf(song)}" onclick="openModal(${songsData.indexOf(song)})">
        ${coverSrc ? `<img src="${escapeHTML(coverSrc)}" alt="${escapeHTML(song.name_jp || song.name)}" loading="lazy">` : '<div class="cover-placeholder"></div>'}
        ${releaseBadge}
        <div class="cover-overlay">
          ${jp}
          ${cn}
          <svg class="cover-info-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <g class="hexagram-ring">
            <polygon class="hexagram-up" points="43.1,13 4.9,13 24,46"/>
            <polygon class="hexagram-down" points="24,2 4.9,35 43.1,35"/>
          </g>
          <path class="eye-almond" d="M16,24 Q24,17 32,24 Q24,31 16,24"/>
          <circle class="eye-pupil" cx="24" cy="24" r="3"/>
        </svg>
        </div>
      </div>`;
  }

  // ===== 搜索 =====
  document.getElementById("searchInput").addEventListener("input", function() {
    searchQuery = this.value.trim();
    renderGallery();
  });

  // ===== 排序 =====
  const sortBtn = document.getElementById("sortBtn");
  const sortLabel = document.getElementById("sortLabel");
  sortBtn.addEventListener("click", function() {
    sortAsc = !sortAsc;
    sortLabel.textContent = sortAsc ? "时间倒序" : "时间正序";
    renderGallery();
  });

  window.openModal = function(index) {
    SongModal.open(index, { songs: songsData, discography: discographyData, lives: livesData, updateHash: true });
  };

  newReleaseSpotlight.addEventListener("click", function(event) {
    const card = event.target.closest("[data-song-index]");
    if (card) openModal(Number(card.dataset.songIndex));
  });

  // 仅在浏览者回看内容时提示返回顶部，避免向下浏览时遮挡画面。
  const songsPageTopBtn = document.getElementById("songsPageTopBtn");
  let songsPageTopLastScrollY = window.scrollY;
  let songsPageTopUpwardDistance = 0;
  let songsPageTopHideTimer = 0;
  let songsPageTopIsReturning = false;

  function hideSongsPageTop(resetIntent = true) {
    songsPageTopBtn.classList.remove("show");
    window.clearTimeout(songsPageTopHideTimer);
    if (resetIntent) songsPageTopUpwardDistance = 0;
  }

  function showSongsPageTop() {
    songsPageTopBtn.classList.add("show");
    window.clearTimeout(songsPageTopHideTimer);
    songsPageTopHideTimer = window.setTimeout(hideSongsPageTop, 4000);
  }

  function songsPageTopMinScroll() {
    const maxScroll = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
    return Math.min(800, Math.max(240, maxScroll * 0.25));
  }

  window.addEventListener("scroll", function() {
    const currentScrollY = window.scrollY;
    const delta = currentScrollY - songsPageTopLastScrollY;
    const overlayOpen = document.querySelector(
      ".shared-song-modal-overlay.open, .shared-live-drawer-overlay.shared-live-active, " +
      ".shared-discography-modal-overlay.open, .shared-interview-overlay.active"
    );
    if (songsPageTopIsReturning || currentScrollY < songsPageTopMinScroll() || overlayOpen) {
      hideSongsPageTop();
    } else if (delta > 2) {
      hideSongsPageTop();
    } else if (delta < -2) {
      songsPageTopUpwardDistance += -delta;
      if (songsPageTopUpwardDistance >= 160) showSongsPageTop();
    }
    songsPageTopLastScrollY = currentScrollY;
  }, { passive: true });

  document.addEventListener("pointerdown", function(event) {
    if (!songsPageTopBtn.contains(event.target)) hideSongsPageTop();
  }, true);

  songsPageTopBtn.addEventListener("click", function() {
    songsPageTopIsReturning = true;
    hideSongsPageTop();
    document.body.style.overflowAnchor = "none";
    window.scrollTo({ top: 0, behavior: "smooth" });
    window.setTimeout(function() {
      songsPageTopIsReturning = false;
      songsPageTopLastScrollY = window.scrollY;
      document.body.style.overflowAnchor = "auto";
    }, 1200);
  });

  renderNewReleaseSpotlight();
  renderGallery();
  function scheduleSongDateRefresh() {
    const nextDay = todayTimestamp() + 86400000 - JAPAN_OFFSET_MS;
    window.setTimeout(() => {
      renderNewReleaseSpotlight();
      renderGallery();
      scheduleSongDateRefresh();
    }, Math.max(1000, nextDay - Date.now() + 1000));
  }
  scheduleSongDateRefresh();
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
      renderNewReleaseSpotlight();
      renderGallery();
    }
  });

  // Something New 入口：使用可读的 song_name 定位，并直接打开歌曲组件。
  const directSongName = new URLSearchParams(window.location.search).get("song");
  if (directSongName) {
    const directIdx = songsData.findIndex(s => s.name === directSongName);
    const cleanUrl = new URL(window.location.href);
    cleanUrl.searchParams.delete("song");
    history.replaceState(null, "", cleanUrl.pathname + cleanUrl.search + cleanUrl.hash);
    if (directIdx >= 0) {
      SongModal.open(directIdx, { songs: songsData, discography: discographyData, lives: livesData, updateHash: false });
    }
  }

  // 哈希自动打开：/songs/index.html#song=HASH_ID
  if (!directSongName && window.location.hash.startsWith("#song=")) {
    const hashId = window.location.hash.slice(6);
    const idx = songsData.findIndex(s => s.hash_id === hashId);
    if (idx >= 0) openModal(idx);
  }
})();
  </script>
  <script src="vendor/wordcloud2.js?v=202609200002"></script>
  <script src="lyrics-atlas.js?v=202609200002"></script>


</body>
</html>
