<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../favicon.ico">
  <title>Songs · 唯鸡百科</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=202609082359">
  <link rel="stylesheet" href="../css/song-modal.css?v=202609082359">
</head>
<body>
  <div class="songs-page">
    <header class="page-header">
      <a href="../index.html" class="back-nav">&larr; 返回主页</a>
      <h1>Songs</h1>
    </header>

    <!-- 工具栏 -->
    <div class="toolbar">
      <div class="filter-group">
        <button class="main-tag" id="filterOriginal" data-type="Original">
          <span class="diamond">◆</span> 仅显示原创
        </button>
        <button class="main-tag" id="filterCover" data-type="Cover">
          <span class="diamond">◆</span> 仅显示翻唱
        </button>
      </div>
      <div class="separator"></div>
      <div class="search-box">
        <span class="search-icon">&#128269;</span>
        <input type="text" id="searchInput" placeholder="搜索歌名...">
      </div>
      <span class="result-count" id="resultCount"></span>
      <button class="sort-btn" id="sortBtn">
        <span id="sortLabel">时间倒序</span>
      </button>
    </div>

    <!-- 画廊主体 -->
    <div id="gallery"></div>

    <!-- 无结果 -->
    <div class="no-results" id="noResults" style="display:none">没有找到匹配的歌曲</div>
  </div>

  <script src="data.js?v=202609082359"></script>
  <script src="../interview/data.js?v=202609082359"></script>
  <script src="../js/renderMarkdown.js?v=202609082359"></script>
  <script src="../js/song-modal.js?v=202609082359"></script>
  <script>
(function() {
  let sortAsc = true;  // 默认：时间正序（旧→新）
  let searchQuery = "";
  let activeType = null;  // null | "Original" | "Cover"

  // ===== 类型筛选按钮 =====
  document.getElementById("filterOriginal").addEventListener("click", function() {
    if (activeType === "Original") {
      activeType = null;
      this.classList.remove("active");
    } else {
      activeType = "Original";
      this.classList.add("active");
      document.getElementById("filterCover").classList.remove("active");
    }
    renderGallery();
  });
  document.getElementById("filterCover").addEventListener("click", function() {
    if (activeType === "Cover") {
      activeType = null;
      this.classList.remove("active");
    } else {
      activeType = "Cover";
      this.classList.add("active");
      document.getElementById("filterOriginal").classList.remove("active");
    }
    renderGallery();
  });

  // ===== 按年份分组 =====
  function groupByYear() {
    const map = {};
    songsData.forEach(song => {
      const year = (song.release_date || "").substring(0, 4) || "未分类";
      if (!map[year]) map[year] = { year, songs: [] };
      map[year].songs.push(song);
    });
    let years = Object.values(map);
    years.sort((a, b) => {
      const ya = parseInt(a.year) || 0;
      const yb = parseInt(b.year) || 0;
      return sortAsc ? ya - yb : yb - ya;
    });
    return years;
  }

  function filterSongs(songs) {
    let filtered = songs;
    if (activeType) {
      filtered = filtered.filter(s => s.type === activeType);
    }
    if (!searchQuery) return filtered;
    const q = searchQuery.toLowerCase();
    return filtered.filter(s => {
      return s.name.toLowerCase().includes(q) ||
             (s.name_jp && s.name_jp.toLowerCase().includes(q)) ||
             (s.search_keywords && s.search_keywords.toLowerCase().includes(q));
    });
  }

  const gallery = document.getElementById("gallery");
  const noResults = document.getElementById("noResults");
  const resultCount = document.getElementById("resultCount");

  function renderGallery() {
    gallery.innerHTML = "";
    let totalVisible = 0;
    const years = groupByYear();

    years.forEach(year => {
      const filtered = filterSongs(year.songs);
      filtered.sort((a, b) => {
        const da = parseDate(a.release_date);
        const db = parseDate(b.release_date);
        return sortAsc ? da - db : db - da;
      });
      if (filtered.length === 0) return;
      totalVisible += filtered.length;

      const section = document.createElement("div");
      section.className = "album-section";
      section.innerHTML = `
        <div class="album-divider">
          <span class="album-name">${escapeHTML(year.year)}</span>
        </div>
        <div class="cover-grid">
          ${filtered.map(s => renderCoverCard(s)).join("")}
        </div>`;
      gallery.appendChild(section);
    });

    noResults.style.display = totalVisible === 0 ? "block" : "none";
    resultCount.textContent = totalVisible > 0 ? `共 ${totalVisible} 首` : "";
  }

  function escapeHTML(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
  function stripTime(dateStr) {
    // 去除 00:00:00 等时间部分，保留 YYYY-MM-DD 或 YYYY/M/D
    return dateStr.replace(/\s[\d:]+$/, "").trim();
  }
  function parseDate(str) {
    if (!str) return 0;
    // 支持 2023/5/7、2023-05-07、2023/05/07 等格式
    const parts = str.split(/[\/\-]/);
    if (parts.length < 3) return 0;
    const y = parseInt(parts[0]) || 0;
    const m = parseInt(parts[1]) || 0;
    const d = parseInt(parts[2]) || 0;
    return y * 10000 + m * 100 + d;
  }

  function renderCoverCard(song) {
    const coverSrc = song.cover || "";
    const jp = song.name_jp ? `<span class="cover-song-name">${escapeHTML(song.name_jp)}</span>` : "";
    const cn = song.name ? `<span class="cover-song-name-cn">${escapeHTML(song.name)}</span>` : "";
    return `
      <div class="cover-card type-${(song.type || '').toLowerCase()}" data-song-index="${songsData.indexOf(song)}" onclick="openModal(${songsData.indexOf(song)})">
        ${coverSrc ? `<img src="${escapeHTML(coverSrc)}" alt="${escapeHTML(song.name_jp || song.name)}" loading="lazy">` : '<div class="cover-placeholder"></div>'}
        <div class="cover-overlay">
          ${jp}
          ${cn}
          <svg class="cover-info-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <g class="hexagram-ring">
            <polygon class="hexagram-up" points="43.1,13 4.9,13 24,46"/>
            <polygon class="hexagram-down" points="24,2 4.9,35 43.1,35"/>
          </g>
          <path class="eye-almond" d="M16,24 Q24,17 32,24 Q24,31 16,24"/>
          <circle class="eye-pupil" cx="24" cy="24" r="3"/>
        </svg>
        </div>
      </div>`;
  }

  // ===== 搜索 =====
  document.getElementById("searchInput").addEventListener("input", function() {
    searchQuery = this.value.trim();
    renderGallery();
  });

  // ===== 排序 =====
  const sortBtn = document.getElementById("sortBtn");
  const sortLabel = document.getElementById("sortLabel");
  sortBtn.addEventListener("click", function() {
    sortAsc = !sortAsc;
    sortLabel.textContent = sortAsc ? "时间倒序" : "时间正序";
    renderGallery();
  });

  window.openModal = function(index) {
    SongModal.open(index, { songs: songsData, updateHash: true });
  };

  renderGallery();

  // 哈希自动打开：/songs/index.html#song=HASH_ID
  if (window.location.hash.startsWith("#song=")) {
    const hashId = window.location.hash.slice(6);
    const idx = songsData.findIndex(s => s.hash_id === hashId);
    if (idx >= 0) openModal(idx);
  }
})();
  </script>

  <!-- 访谈沉浸式浮层（嵌入 songs 页面） -->
  <div class="cinematic-overlay" id="cinematicOverlay">
    <div class="cinematic-header">
      <div class="cinematic-meta">
        <span class="cinematic-date" id="cDate"></span>
        <span class="cinematic-title" id="cTitle"></span>
        <span class="cinematic-interviewee" id="cInterviewee"></span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="cinematic-original-btn" id="cOriginalBtn" title="切换原文显示">原文显示</button>
        <button class="cinematic-close" id="cClose">&times;</button>
      </div>
    </div>
    <div class="cinematic-body" id="cBody"></div>
  </div>

  <!-- 返回顶部按钮 -->
  <button class="page-top-btn" id="pageTopBtn">↑Page Top</button>

  <script>
    // ==================== 访谈浮层逻辑 ====================
    (function() {
      const overlay = document.getElementById("cinematicOverlay");
      const body = document.getElementById("cBody");
      const renderedCache = [];

      function formatDate(dateStr) {
        if (!dateStr) return "";
        dateStr = dateStr.replace(/\s[\d:]+$/, "").trim();
        let m;
        if ((m = dateStr.match(/(\d{4})[\/\-\.年](\d{1,2})[\/\-\.月](\d{1,2})[日]?/))) {
          return m[1] + "/" + m[2].padStart(2, "0") + "/" + m[3].padStart(2, "0");
        }
        return dateStr;
      }

      window.openInterviewCinematic = function(title) {
        const idx = interviewData.findIndex(item => item.title === title);
        if (idx === -1) return;
        const item = interviewData[idx];

        document.getElementById("cDate").textContent = formatDate(item.date);
        document.getElementById("cTitle").textContent = item.title;
        document.getElementById("cInterviewee").textContent = item.interviewee;

        if (!renderedCache[idx]) {
          renderedCache[idx] = '<div class="md-content">' + renderMarkdown(item.md_html) + '</div>';
        }
        body.innerHTML = renderedCache[idx];
        overlay.classList.add("active");
        document.body.style.overflow = "hidden";
        body.scrollTop = 0;
      };

      // 原文显示切换
      let showOriginal = true;
      document.getElementById("cOriginalBtn").addEventListener("click", function() {
        const blocks = body.querySelectorAll("p, h1, h2, h3, li, blockquote");
        let anchor = null;
        let minDist = Infinity;
        const viewCenter = window.innerHeight / 2;
        for (let b of blocks) {
          const rect = b.getBoundingClientRect();
          if (rect.top < window.innerHeight && rect.bottom > 0) {
            const dist = Math.abs(viewCenter - (rect.top + rect.height / 2));
            if (dist < minDist) { minDist = dist; anchor = b; }
          }
        }
        const oldTop = anchor ? anchor.getBoundingClientRect().top : 0;
        showOriginal = !showOriginal;
        this.textContent = showOriginal ? "原文显示" : "隐藏原文";
        if (showOriginal) {
          this.classList.remove("hidden-original");
          body.classList.remove("hide-original");
        } else {
          this.classList.add("hidden-original");
          body.classList.add("hide-original");
        }
        if (anchor) {
          requestAnimationFrame(() => {
            body.style.overflowAnchor = "none";
            const newTop = anchor.getBoundingClientRect().top;
            body.scrollBy(0, newTop - oldTop);
            body.style.overflowAnchor = "auto";
          });
        }
      });

      document.getElementById("cClose").addEventListener("click", () => {
        overlay.classList.remove("active");
        document.body.style.overflow = window.SongModal && SongModal.isOpen() ? "hidden" : "";
        pageTopBtn.classList.remove("show");
      });

      overlay.addEventListener("click", function(e) {
        if (e.target === overlay) {
          overlay.classList.remove("active");
          document.body.style.overflow = window.SongModal && SongModal.isOpen() ? "hidden" : "";
          pageTopBtn.classList.remove("show");
        }
      });

      document.addEventListener("keydown", function(e) {
        if (e.key === "Escape" && overlay.classList.contains("active")) {
          overlay.classList.remove("active");
          document.body.style.overflow = window.SongModal && SongModal.isOpen() ? "hidden" : "";
          pageTopBtn.classList.remove("show");
        }
      });

      // ==================== 返回顶部按钮 ====================
      const pageTopBtn = document.getElementById("pageTopBtn");
      let ptLastScrollY = window.scrollY;

      function getScrollContainer() {
        if (overlay.classList.contains("active")) {
          return { el: body, isWindow: false };
        }
        return { el: window, isWindow: true };
      }

      function getScrollTop(container) {
        return container.isWindow ? window.scrollY : container.el.scrollTop;
      }

      function scrollToTop(container) {
        if (container.isWindow) {
          document.body.style.overflowAnchor = "none";
          window.scrollTo({ top: 0, behavior: "smooth" });
        } else {
          container.el.style.overflowAnchor = "none";
          container.el.scrollTo({ top: 0, behavior: "smooth" });
        }
        setTimeout(() => {
          (container.isWindow ? document.body : container.el).style.overflowAnchor = "auto";
        }, 1000);
      }

      document.addEventListener("scroll", function(e) {
        const container = getScrollContainer();
        // 仅在浮层激活时显示按钮
        if (!container.isWindow) {
          const currentScrollY = getScrollTop(container);
          if (currentScrollY < 800) {
            pageTopBtn.classList.remove("show");
          } else if (currentScrollY > ptLastScrollY) {
            pageTopBtn.classList.remove("show");
          } else {
            pageTopBtn.classList.add("show");
          }
          ptLastScrollY = currentScrollY;
        }
      }, true);

      pageTopBtn.addEventListener("click", () => {
        scrollToTop(getScrollContainer());
      });
    })();
  </script>
</body>
</html>
