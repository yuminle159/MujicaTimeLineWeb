<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../favicon.ico">
  <title>Songs · 唯鸡百科</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=202609232204">
  <link rel="stylesheet" href="../css/song-modal.css?v=202609232204">
  <link rel="stylesheet" href="../css/live-drawer.css?v=202609232204">
  <link rel="stylesheet" href="../css/discography-modal.css?v=202609232204">
  <link rel="stylesheet" href="../css/interview-overlay.css?v=202609232204">
  <link rel="stylesheet" href="../css/local-search.css?v=202609232204">
  <link rel="stylesheet" href="../css/quick-nav.css?v=202609232204">
</head>
<body>
  <div class="songs-page">
    <header class="page-header">
      <a href="../index.html" class="back-nav" aria-label="返回主页">&larr;Home</a>
      <h1>Songs</h1>
    </header>

    <section class="new-release-spotlight" id="newReleaseSpotlight" aria-label="新曲发布" hidden></section>

    <!-- 工具栏 -->
    <div class="toolbar">
      <div class="filter-group">
        <button class="main-tag" id="filterOriginal" data-type="Original">
          <span class="diamond">◆</span> 仅显示原创
        </button>
        <button class="main-tag" id="filterCover" data-type="Cover">
          <span class="diamond">◆</span> 仅显示翻唱
        </button>
      </div>
      <div class="separator"></div>
      <div class="search-box">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input type="search" id="searchInput" placeholder="搜索歌曲…" autocomplete="off" aria-label="搜索歌曲">
      </div>
      <span class="result-count" id="resultCount"></span>
      <button class="lyrics-atlas-trigger" id="lyricsAtlasTrigger" type="button">Lyrics Atlas</button>
      <button class="sort-btn" id="sortBtn">
        <span id="sortLabel">时间倒序</span>
      </button>
    </div>

    <!-- 画廊主体 -->
    <div id="gallery"></div>

    <!-- 无结果 -->
    <div class="no-results" id="noResults" style="display:none">没有找到匹配的歌曲</div>

    <button class="songs-page-top-btn" id="songsPageTopBtn" type="button" aria-label="返回页面顶部">↑ Page Top</button>
  </div>

  <script src="data.js?v=202609232204"></script>
  <script src="../js/data-loader.js?v=202609232204"></script>
  <script src="../js/renderMarkdown.js?v=202609232204"></script>
  <script src="../js/overlay-manager.js?v=202609232204"></script>
  <script src="../js/interview-overlay.js?v=202609232204"></script>
  <script src="../js/song-modal.js?v=202609232204"></script>
  <script src="../js/live-drawer.js?v=202609232204"></script>
  <script src="../js/discography-modal.js?v=202609232204"></script>
  <script src="lyrics-atlas-data.js?v=202609232204"></script>
  <script src="page.js?v=202609232204"></script>
  <script src="vendor/wordcloud2.js?v=202609232204"></script>
  <script src="lyrics-atlas.js?v=202609232204"></script>
  <script src="../js/quick-nav.js?v=202609232204"></script>
  <script src="../js/page-memory.js?v=202609232204"></script>


</body>
</html>
