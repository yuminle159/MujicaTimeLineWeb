<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../favicon.ico">
  <title>Live · 唯鸡百科</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=202609062217">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="live-page">
    <header class="page-header">
      <a class="back-nav" href="../index.html">← 返回主页</a>
      <h1>Live</h1>
    </header>

    <div class="filter-bar" id="liveFilterBar"></div>

    <main class="gallery-container" id="gallery">
      <div class="no-results" id="noResults" style="display:none">没有找到匹配的演唱会</div>
    </main>
  </div>

  <!-- 抽屉详情 -->
  <div id="liveDrawer" class="drawer-overlay" onclick="closeDrawer(event)">
    <div class="drawer" onclick="event.stopPropagation()">
      <button class="close-btn" onclick="closeDrawer(event)">&times;</button>
      <div class="drawer-body" id="drawerBody"></div>
    </div>
  </div>

  <!-- Song 详情模态框（嵌入，用于 setlist 点击） -->
  <div class="song-modal-overlay" id="songModalOverlay">
    <div class="song-modal-container" id="songModalContainer">
      <button class="song-modal-close" id="songModalClose">&times;</button>
      <div class="song-modal-left" id="songModalLeft"></div>
      <div class="song-modal-right" id="songModalRight"></div>
    </div>
  </div>

  <!-- MC 弹窗 -->
  <div id="mcModal" class="mc-modal" onclick="closeMcModal()">
    <div class="mc-modal-container" onclick="event.stopPropagation()">
      <button class="mc-modal-close" onclick="closeMcModal()">&times;</button>
      <div class="mc-modal-body" id="mcModalBody"></div>
    </div>
  </div>

  <!-- KV 全图灯箱 -->
  <div id="kvLightbox" class="kv-lightbox" onclick="closeKvLightbox()">
    <button class="kv-lightbox-close" onclick="closeKvLightbox()">&times;</button>
    <button class="kv-lightbox-arrow kv-lightbox-prev" onclick="event.stopPropagation();moveKvLightbox(-1)">&#10094;</button>
    <img id="kvLightboxImg" src="" alt="" onclick="event.stopPropagation();toggleKvHud()">
    <div class="kv-lightbox-hud" id="kvLightboxHud" onclick="event.stopPropagation()">
      <div class="hud-info-block">
        <div class="hud-title" id="hudTitle"></div>
        <div class="hud-desc" id="hudDesc"></div>
      </div>
      <div class="hud-right">
        <a class="hud-source-btn" id="hudSourceBtn" href="#" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="display:none">↗ SOURCE</a>
        <div class="hud-counter" id="hudCounter">
          <span class="counter-label">FILE_</span>
          <span class="counter-num" id="hudCounterNum"></span>
        </div>
      </div>
    </div>
    <button class="kv-lightbox-arrow kv-lightbox-next" onclick="event.stopPropagation();moveKvLightbox(1)">&#10095;</button>
  </div>

  <!-- 数据统计浮窗 -->
  <div id="statsOverlay" class="stats-overlay">
    <div class="stats-container">
      <div class="stats-header">
        <h2>Live Statistics</h2>
        <button class="stats-close" id="statsCloseBtn" onclick="closeStats()">&times;</button>
      </div>
      <div class="stats-body" id="statsBody">
        <div class="stats-loading">Loading statistics...</div>
      </div>
    </div>
  </div>

  <script src="../songs/data.js?v=202609062217"></script>
  <script src="data.js?v=202609062217"></script>
  <script src="../js/renderMarkdown.js?v=202609062217"></script>
  <script>
(function() {
  const gallery = document.getElementById("gallery");
  const noResults = document.getElementById("noResults");
  const drawerOverlay = document.getElementById("liveDrawer");
  const drawerBody = document.getElementById("drawerBody");
  let cachedLiveIndex = -1;  // 缓存已渲染的演唱会，避免重复构建

  // 歌曲名→索引 查找表（用于 setlist 点击跳转）
  const songLookup = {};
  if (typeof livesData !== "undefined") {
    // 解析日期为可比较数值（处理 YYYY/M/D 和 YYYY-M-D 格式）
    function parseDateStamp(d) {
      if (!d) return 0;
      const m = d.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
      return m ? parseInt(m[1]) * 10000 + parseInt(m[2]) * 100 + parseInt(m[3]) : 0;
    }
    livesData.sort((a, b) => parseDateStamp(a.date) - parseDateStamp(b.date));
    songsData.forEach((s, i) => { if (s.name_jp) songLookup[s.name_jp] = i; });
  }

  // MC 弹窗
  window._mcContentMap = {};
  window.closeMcModal = function() {
    document.getElementById("mcModal").classList.remove("active");
    document.body.style.overflow = "";
  };
  window.openMcModal = function(key) {
    const mcContent = window._mcContentMap[key];
    document.getElementById("mcModalBody").innerHTML = renderMarkdown(mcContent, { mode: "mc" });
    document.getElementById("mcModal").classList.add("active");
    document.body.style.overflow = "hidden";
  };

  function escapeHTML(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  function stripTime(dateStr) {
    if (!dateStr) return "";
    return dateStr.replace(/\s[\d:]+$/, "").trim();
  }

  // ===== 筛选 =====
  let activeLiveTag = null;
  let liveSortReverse = false;

  function buildLiveFilter() {
    const bar = document.getElementById("liveFilterBar");
    if (!bar) return;
    // 收集所有唯一的 tag
    const tags = new Set();
    livesData.forEach(l => { if (l.tag) tags.add(l.tag); });
    if (tags.size === 0) return;

    let html = '<div class="filter-group"><button class="main-tag active" data-tag=""><span class="diamond">◆</span> ALL</button></div>';
    const sorted = [...tags].sort();
    sorted.forEach((t) => {
      html += '<div class="separator"></div>';
      html += '<div class="filter-group"><button class="main-tag" data-tag="' + escapeHTML(t) + '"><span class="diamond">◆</span> ' + escapeHTML(t) + '</button></div>';
    });
    bar.innerHTML = html;

    bar.querySelectorAll(".main-tag").forEach(btn => {
      btn.addEventListener("click", function() {
        bar.querySelectorAll(".main-tag").forEach(b => b.classList.remove("active"));
        this.classList.add("active");
        activeLiveTag = this.getAttribute("data-tag") || null;
        renderGallery();
      });
    });

    // 数据统计按钮（放在排序按钮左边，紧靠）
    const statsBtn = document.createElement("button");
    statsBtn.className = "sort-btn";
    statsBtn.textContent = "数据统计";
    statsBtn.style.marginRight = "6px";
    statsBtn.addEventListener("click", openStats);
    bar.appendChild(statsBtn);

    // 排序按钮
    const sortBtn = document.createElement("button");
    sortBtn.className = "sort-btn";
    sortBtn.style.marginLeft = "0";
    sortBtn.innerHTML = '<span>时间倒序</span>';
    sortBtn.addEventListener("click", () => {
      liveSortReverse = !liveSortReverse;
      sortBtn.innerHTML = liveSortReverse ? '<span>时间正序</span>' : '<span>时间倒序</span>';
      renderGallery();
    });
    bar.appendChild(sortBtn);
  }

  // ===== 渲染画廊 =====
  function renderGallery() {
    gallery.innerHTML = "";
    let filtered = livesData;
    if (activeLiveTag) {
      filtered = livesData.filter(l => l.tag === activeLiveTag);
    }
    if (filtered.length === 0) {
      noResults.style.display = "block";
      return;
    }
    noResults.style.display = "none";

    // 按日期排列
    filtered.sort((a, b) => {
      const cmp = parseDateStamp(a.date) - parseDateStamp(b.date);
      return liveSortReverse ? -cmp : cmp;
    });

    filtered.forEach((live, i) => {
      // 使用原始索引以便打开抽屉
      const origIdx = livesData.indexOf(live);
      const card = document.createElement("article");
      card.className = "live-card";
      card.innerHTML = `
        <div class="card-image${live.tag ? ' tag-' + live.tag.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/-+$/, '') : ''}" onclick="openDrawer(${origIdx})">
          ${live.poster ? `<img src="${escapeHTML(live.poster)}" alt="${escapeHTML(live.name)}" loading="lazy">` : '<div class="card-placeholder"></div>'}
        </div>
        <div class="card-info" onclick="openDrawer(${origIdx})">
          <div class="card-date">${stripTime(escapeHTML(live.date))}</div>
          <h2 class="card-title">${escapeHTML(live.name)}</h2>
          <div class="card-meta-row">${live.tag ? `<span class="card-tag">${escapeHTML(live.tag)}</span>` : ""}<span class="card-venue">${escapeHTML(live.venue)}</span></div>
        </div>`;
      gallery.appendChild(card);
    });
  }

  // ===== 打开抽屉 =====
  window.openDrawer = function(index) {
    const live = livesData[index];
    if (!live) return;
    if (cachedLiveIndex === index) {
      drawerOverlay.classList.add("active");
      document.body.style.overflow = "hidden";
      history.replaceState(null, '', '#live=' + encodeURIComponent(live.name));
      return;
    }
    document.body.style.overflow = "hidden";

    // 曲目列表
    let setlistHTML = "";
    if (live.setlist && live.setlist.length) {
      setlistHTML = `<div class="col-setlist">
        <h3 class="section-title">Setlist</h3>
        <ul class="setlist-list">`;
      live.setlist.forEach((track, j) => {
        const num = track.num || "&nbsp;&nbsp;";
        const songIdx = (track.title !== "Interlude") ? songLookup[track.title] : undefined;
        const hasMc = !!(track.mc_content);
        const clickable = (songIdx !== undefined) || hasMc;
        const labelClass = track.highlight_label ? ` highlight-${track.highlight_label.toLowerCase().replace(/\s+/g, '-')}` : "";
        let clickAttr = "";
        if (songIdx !== undefined) {
          clickAttr = `onclick="event.stopPropagation();openSongModal(${songIdx})"`;
        } else if (hasMc) {
          const mcKey = `mc_${index}_${j}`;
          window._mcContentMap[mcKey] = track.mc_content;
          clickAttr = `onclick="event.stopPropagation();openMcModal('${mcKey}')"`;
        }
        // 眼睛图标：仅当 link 有效（非空、非0、以http开头）时显示
        const linkUrl = (track.link && track.link !== "0" && /^https?:\/\//i.test(track.link)) ? track.link : "";
        const eyeIcon = linkUrl ? `<svg class="track-link-eye" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" onclick="event.stopPropagation();window.open('${escapeHTML(linkUrl)}', '_blank')" title="查看来源"><path class="eye-almond" d="M16,24 Q24,17 32,24 Q24,31 16,24"/><circle class="eye-pupil" cx="24" cy="24" r="3"/></svg>` : "";
        setlistHTML += `<li class="setlist-item${clickable ? ' setlist-clickable' : ''}">
          <div class="track-info" ${clickAttr}>
            <span class="track-num">${num}</span>
            <span class="track-title">${escapeHTML(track.title)}${clickable ? ' <span class="track-link-icon">↗</span>' : ''}</span>
            ${eyeIcon}
            <span class="track-highlight${labelClass}"${track.highlight_text ? ` data-tooltip="${escapeHTML(track.highlight_text).replace(/"/g, '&quot;').replace(/\\n/g, '&#10;')}"` : ""}>${track.highlight_label ? `<span class="highlight-badge">${escapeHTML(track.highlight_label)}</span>` : ""}${track.highlight_text ? `<span class="highlight-desc">${escapeHTML(track.highlight_text).replace(/\\n/g, "<br>")}</span>` : ""}</span>
          </div>
        </li>`;
      });
      setlistHTML += `</ul></div>`;
    }

    // 幕后照片（按 group_id 分组，同组照片使用轮播）
    let backstageHTML = "";
    window._backstageGroups = null;
    if (live.backstage && live.backstage.length) {
      // 分组：无 group_id 的独立显示，相同 group_id 的归入一组
      const groups = [];
      let currentGroup = null;
      live.backstage.forEach(photo => {
        const gid = photo.group_id || "";
        if (!gid) {
          groups.push({ photos: [photo], credit: photo.credit, credit_text: photo.credit_text, source_url: photo.source_url, source_label: photo.source_label });
        } else if (currentGroup && currentGroup.id === gid) {
          currentGroup.photos.push(photo);
        } else {
          currentGroup = { id: gid, photos: [photo], credit: photo.credit, credit_text: photo.credit_text, source_url: photo.source_url, source_label: photo.source_label };
          groups.push(currentGroup);
        }
      });
      // 存储到全局以便 lightbox 轮播使用
      window._backstageGroups = groups;

      backstageHTML = `<div class="col-gallery">
        <h3 class="section-title">Backstage</h3>
        <div class="photo-grid">`;
      groups.forEach((group, gi) => {
        const firstPhoto = group.photos[0];
        const photoUrls = group.photos.map(p => p.photo);
        const photoCredits = group.photos.map(p => p.credit || group.credit || "");
        const photoCreditTexts = group.photos.map(p => p.credit_text || "");
        const photoSourceUrls = group.photos.map(p => p.source_url || group.source_url || "");
        const photoSourceLabels = group.photos.map(p => p.source_label || group.source_label || "");
        const multiBadge = group.photos.length > 1 ? `<span class="multi-badge">+${group.photos.length - 1}</span>` : "";
        backstageHTML += `<div class="photo-card">
          <img src="${escapeHTML(firstPhoto.photo)}" alt="${escapeHTML(group.credit || '')}" onclick="openKvLightbox('${escapeHTML(firstPhoto.photo)}', ${JSON.stringify(photoUrls).replace(/"/g, '&quot;')}, 0, ${JSON.stringify(photoCredits).replace(/"/g, '&quot;')}, ${JSON.stringify(photoCreditTexts).replace(/"/g, '&quot;')}, ${JSON.stringify(photoSourceUrls).replace(/"/g, '&quot;')}, ${JSON.stringify(photoSourceLabels).replace(/"/g, '&quot;')})">
          ${group.credit ? `<span class="credit-tag">${escapeHTML(group.credit)}</span>` : ""}
          ${multiBadge}
        </div>`;
      });
      backstageHTML += `</div></div>`;
    }

    drawerBody.innerHTML = `
      <div class="drawer-hero">
        ${live.kv ? `<img class="hero-poster" src="${escapeHTML(live.kv)}" alt="${escapeHTML(live.name)}" onclick="openKvLightbox('${escapeHTML(live.kv)}')">` : (live.poster ? `<img class="hero-poster" src="${escapeHTML(live.poster)}" alt="${escapeHTML(live.name)}">` : "")}
        <div class="hero-info">
          <div class="hero-date">${stripTime(escapeHTML(live.date))}</div>
          <h1 class="hero-title">${escapeHTML(live.name)}</h1>
          <div class="hero-meta-row">${live.tag ? '🎵 <span class="hero-tag">' + escapeHTML(live.tag) + '</span>' : ""}${live.venue ? ' 📍 ' + escapeHTML(live.venue) : ""}</div>
          <div class="hero-action-row">
            ${live.video_url ? `<a href="${escapeHTML(live.video_url)}" class="btn-play" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              WATCH ARCHIVE
            </a>` : `<span class="btn-unrecorded">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              UNRECORDED
            </span>`}
            ${live.description ? `<span class="hero-desc">${escapeHTML(live.description)}</span>` : ""}
          </div>
        </div>
      </div>
      <div class="drawer-content">
        ${setlistHTML}
        ${backstageHTML}
      </div>`;

    drawerOverlay.classList.add("active");
    cachedLiveIndex = index;
    history.replaceState(null, '', '#live=' + encodeURIComponent(live.name));

    // 预加载当前抽屉所有 backstage 图片（缩略图已渲染，此处预加载灯箱大图）
    const groups = window._backstageGroups;
    if (groups && groups.length) {
      groups.forEach(group => {
        group.photos.forEach(photo => {
          const img = new Image();
          img.src = photo.photo;
        });
      });
    }
  };

  // ===== 关闭抽屉 =====
  window.closeDrawer = function(event) {
    if (event.target === drawerOverlay || event.target.classList.contains("close-btn")) {
      drawerOverlay.classList.remove("active");
      document.body.style.overflow = "";
      history.replaceState(null, '', window.location.pathname + window.location.search);
    }
  };

  // ===== 键盘 ESC 关闭 =====
  document.addEventListener("keydown", function(e) {
    if (e.key === "Escape") {
      const mcModal = document.getElementById("mcModal");
      if (mcModal && mcModal.classList.contains("active")) {
        closeMcModal();
        return;
      }
      if (songModalOverlay.classList.contains("open")) {
        closeSongModal();
        return;
      }
      if (drawerOverlay.classList.contains("active")) {
        drawerOverlay.classList.remove("active");
        document.body.style.overflow = "";
        history.replaceState(null, '', window.location.pathname + window.location.search);
      }
      if (document.getElementById("kvLightbox").classList.contains("active")) {
        closeKvLightbox();
      }
    }
    if (document.getElementById("kvLightbox").classList.contains("active")) {
      if (e.key === "ArrowLeft") moveKvLightbox(-1);
      if (e.key === "ArrowRight") moveKvLightbox(1);
    }
  });

  // ===== KV 全图灯箱 =====
  let kvGroup = null;
  let kvIndex = 0;
  let kvCredits = [];
  let kvCreditTexts = [];
  let kvSourceUrls = [];
  let kvSourceLabels = [];
  function updateKvHud(idx) {
    const hudTitle = document.getElementById("hudTitle");
    const hudDesc = document.getElementById("hudDesc");
    const hudSourceBtn = document.getElementById("hudSourceBtn");
    const hudCounterNum = document.getElementById("hudCounterNum");
    hudTitle.textContent = kvCredits[idx] || "";
    hudDesc.textContent = kvCreditTexts[idx] || "";
    hudCounterNum.textContent = "[ " + (idx + 1) + " / " + kvGroup.length + " ]";
    const sl = (kvSourceLabels[idx] || "").trim().toLowerCase();
    if (sl === "yes" && kvSourceUrls[idx]) {
      hudSourceBtn.href = kvSourceUrls[idx];
      hudSourceBtn.style.display = "flex";
    } else {
      hudSourceBtn.style.display = "none";
    }
  }
  window.openKvLightbox = function(src, group, index, credits, creditTexts, sourceUrls, sourceLabels) {
    kvGroup = (group && group.length > 0) ? group : null;
    kvIndex = (index !== undefined) ? index : 0;
    kvCredits = credits || [];
    kvCreditTexts = creditTexts || [];
    kvSourceUrls = sourceUrls || [];
    kvSourceLabels = sourceLabels || [];
    const lb = document.getElementById("kvLightbox");
    const img = document.getElementById("kvLightboxImg");
    const hud = document.getElementById("kvLightboxHud");
    const hudCounter = document.getElementById("hudCounter");
    img.src = (kvGroup ? kvGroup[kvIndex] : src);
    if (kvGroup) {
      hud.classList.remove("hidden");
      updateKvHud(kvIndex);
      hudCounter.style.display = "flex";
      document.querySelectorAll(".kv-lightbox-arrow").forEach(a => a.style.display = "flex");
    } else {
      hud.classList.add("hidden");
      hudCounter.style.display = "none";
      document.getElementById("hudSourceBtn").style.display = "none";
      document.querySelectorAll(".kv-lightbox-arrow").forEach(a => a.style.display = "none");
    }
    lb.classList.add("active");
    document.body.style.overflow = "hidden";
    img.style.opacity = "0";
    img.onload = () => { img.style.opacity = "1"; };
  };
  window.moveKvLightbox = function(direction) {
    if (!kvGroup) return;
    kvIndex = ((kvIndex + direction) % kvGroup.length + kvGroup.length) % kvGroup.length;
    const img = document.getElementById("kvLightboxImg");
    img.style.opacity = "0";
    img.src = "";
    requestAnimationFrame(() => {
      img.src = kvGroup[kvIndex];
      img.onload = () => { img.style.opacity = "1"; };
    });
    updateKvHud(kvIndex);
  };
  window.closeKvLightbox = function() {
    const lb = document.getElementById("kvLightbox");
    lb.classList.remove("active");
    document.body.style.overflow = "";
    kvGroup = null;
    kvIndex = 0;
  };
  window.toggleKvHud = function() {
    if (!kvGroup) return;
    const hud = document.getElementById("kvLightboxHud");
    hud.classList.toggle("hidden");
  };

  // ===== Backstage 轮播控制器 =====
  window.moveCarousel = function(gi, direction) {
    const track = document.getElementById("carouselTrack_" + gi);
    const counter = document.getElementById("carouselCounter_" + gi);
    if (!track) return;
    const imgs = track.querySelectorAll("img");
    if (imgs.length === 0) return;
    let activeIdx = -1;
    imgs.forEach((img, i) => { if (img.classList.contains("active")) activeIdx = i; });
    const newIdx = ((activeIdx + direction) % imgs.length + imgs.length) % imgs.length;
    imgs.forEach((img, i) => { img.classList.toggle("active", i === newIdx); });
    if (counter) counter.textContent = (newIdx + 1) + " / " + imgs.length;
  };

  // ===== Highlight 气泡 =====
  let bubbleEl = null;
  let bubbleTimer = null;
  document.addEventListener("mouseover", function(e) {
    const trackInfo = e.target.closest(".track-info");
    if (!trackInfo) return;
    const highlight = trackInfo.querySelector(".track-highlight[data-tooltip]");
    if (!highlight) return;
    const tooltip = highlight.getAttribute("data-tooltip");
    if (!tooltip) return;
    // 如果文本已显示全则不弹气泡
    const desc = highlight.querySelector(".highlight-desc");
    if (desc && desc.scrollWidth <= desc.clientWidth) return;
    clearTimeout(bubbleTimer);
    if (!bubbleEl) {
      bubbleEl = document.createElement("div");
      bubbleEl.className = "highlight-bubble";
      document.body.appendChild(bubbleEl);
    }
    bubbleEl.textContent = tooltip;
    bubbleEl.classList.add("show");
    const rect = highlight.getBoundingClientRect();
    bubbleEl.style.left = rect.left + "px";
    bubbleEl.style.top = (rect.top - 8) + "px";
    bubbleEl.style.transform = "translateY(-100%)";
  });
  document.addEventListener("mouseout", function(e) {
    const trackInfo = e.target.closest(".track-info");
    if (trackInfo && e.relatedTarget && trackInfo.contains(e.relatedTarget)) return;
    if (bubbleEl) {
      bubbleTimer = setTimeout(function() {
        if (bubbleEl) bubbleEl.classList.remove("show");
      }, 100);
    }
  });

  // ===== Song 详情模态框（嵌入） =====
  const songModalOverlay = document.getElementById("songModalOverlay");
  const songModalLeft = document.getElementById("songModalLeft");
  const songModalRight = document.getElementById("songModalRight");
  const songModalClose = document.getElementById("songModalClose");
  let cachedSongModalIndex = -1;
  let songModalComments = null;

  function songModalStripTime(dateStr) {
    return dateStr ? dateStr.replace(/\s[\d:]+$/, "").trim() : "";
  }

  window.switchSongComment = function(index) {
    if (!songModalComments || index < 0 || index >= songModalComments.length) return;
    const c = songModalComments[index];
    const textEl = document.getElementById("songCommentaryText");
    const tabs = document.querySelectorAll(".song-comment-tab");
    if (textEl) {
      var dateHTML = c.date ? '<div class="song-comment-date">' + escapeHTML(c.date) + '</div>' : '';
      textEl.innerHTML = dateHTML + escapeHTML(c.text).replace(/\\n/g, "<br>") + (c.source ? (function() {
        const isURL = /^https?:\/\//i.test(c.source);
        if (isURL) {
          return '<div class="song-comment-source"><a href="' + escapeHTML(c.source) + '" target="_blank" rel="noopener">&#128279; 出处</a></div>';
        } else {
          return '<div class="song-comment-source is-text">' + escapeHTML(c.source) + '</div>';
        }
      })() : "");
    }
    tabs.forEach((t, i) => t.classList.toggle("active", i === index));
  };

  window.openSongModal = function(index) {
    // 临时隐藏抽屉，避免 Chrome 中 backdrop-filter 穿透大 GPU 层导致滚动卡顿
    window._drawerWasActive = drawerOverlay.classList.contains("active");
    if (window._drawerWasActive) {
      drawerOverlay.classList.remove("active");
    }
    if (cachedSongModalIndex === index) {
      songModalOverlay.classList.add("open");
      document.body.style.overflow = "hidden";
      return;
    }
    const song = songsData[index];
    if (!song) return;
    document.body.style.overflow = "hidden";

    const cnTitle = song.name ? '<div class="song-modal-title-cn">' + escapeHTML(song.name) + '</div>' : "";
    songModalLeft.innerHTML = '' +
      (song.cover ? '<img class="song-modal-cover" src="' + escapeHTML(song.cover) + '" alt="' + escapeHTML(song.name_jp || song.name) + '">' : "") +
      '<div class="song-modal-title">' + escapeHTML(song.name_jp || song.name) + '</div>' +
      cnTitle +
      (song.type ? '<span class="song-modal-type">' + escapeHTML(song.type) + '</span>' : "") +
      '<div class="song-modal-meta">' +
        (song.release_date ? '<div><span class="song-meta-label">发行日期</span> <span class="song-meta-value">' + escapeHTML(song.release_date) + '</span></div>' : "") +
        (song.album ? '<div><span class="song-meta-label">首发形式</span> <span class="song-meta-value">' + escapeHTML(song.album) + '</span></div>' : "") +
        (song.lyricist ? '<div><span class="song-meta-label">作词</span> <span class="song-meta-value">' + escapeHTML(song.lyricist) + '</span></div>' : "") +
        (song.composer ? '<div><span class="song-meta-label">作曲</span> <span class="song-meta-value">' + escapeHTML(song.composer) + '</span></div>' : "") +
        (song.arranger ? '<div><span class="song-meta-label">编曲</span> <span class="song-meta-value">' + escapeHTML(song.arranger) + '</span></div>' : "") +
        (song.first_stage ? '<div><span class="song-meta-label">首次登台</span> <span class="song-meta-value">' + escapeHTML(song.first_stage) + '</span></div>' : "") +
        (song.mv_url ? '<div><span class="song-meta-label">MV链接</span> <a class="song-meta-link" href="' + escapeHTML(song.mv_url) + '" target="_blank" rel="noopener">观看 MV &#8599;</a></div>' : "") +
        (song.appearances && song.appearances.length ? '<div style="margin-top:12px;"><span class="song-meta-label">收录CD</span><div class="song-appearances-list">' + song.appearances.map(function(a) { return '<span class="song-cd-item"><span class="song-cd-icon"></span><span>' + escapeHTML(a) + '</span></span>'; }).join("") + '</div></div>' : "") +
      '</div>';

    let rightHTML = "";
    if (song.comments && song.comments.length) {
      songModalComments = song.comments;
      let tabsHTML = '<span class="song-comment-tabs">';
      song.comments.forEach(function(c, i) {
        tabsHTML += '<span class="song-comment-tab' + (i === 0 ? ' active' : '') + '" onclick="event.stopPropagation();switchSongComment(' + i + ')">' + escapeHTML(c.from || 'Comment ' + (i + 1)) + '</span>';
      });
      tabsHTML += '</span>';
      var first = song.comments[0];
      rightHTML += '<div class="song-commentary-block">' +
        '<div class="song-commentary-header"><div class="song-section-title">Comment</div>' + tabsHTML + '</div>' +
        '<div class="song-commentary-body"><div class="song-commentary-text" id="songCommentaryText">' + (first.date ? '<div class="song-comment-date">' + escapeHTML(first.date) + '</div>' : '') + escapeHTML(first.text).replace(/\\n/g, "<br>") + '</div></div></div>';
    }

    if (song.lyrics_jp || song.lyrics_cn) {
      var jpLines = (song.lyrics_jp || "").split("\\n");
      var cnLines = (song.lyrics_cn || "").split("\\n");
      var maxLen = Math.max(jpLines.length, cnLines.length);
      var lyricsRows = "";
      for (var i = 0; i < maxLen; i++) {
        var jp = i < jpLines.length ? escapeHTML(jpLines[i]) : "";
        var cn = i < cnLines.length ? escapeHTML(cnLines[i]) : "";
        lyricsRows += '<div class="song-lyrics-row"><span class="song-lyrics-jp">' + jp + '</span><span class="song-lyrics-cn">' + cn + '</span></div>';
      }
      rightHTML += '<div class="song-lyrics-block"><div class="song-lyrics-header"><div class="song-section-title" style="border:none;margin:0;padding:0;">Lyrics</div></div>' +
        '<div class="song-lyrics-columns">' + lyricsRows + '</div></div>';
    }

    if (song.live_history && song.live_history.length) {
      var lh = song.live_history;
      var sorted = [].concat(lh).sort(function(a, b) { return (a.date || "").localeCompare(b.date || ""); });
      var firstDate = songModalStripTime(sorted[0] && sorted[0].date || "");
      var lastDate = songModalStripTime(sorted[sorted.length - 1] && sorted[sorted.length - 1].date || "");
      var stats = firstDate + ' ~ ' + lastDate + '，共演奏 ' + lh.length + ' 次';
      rightHTML += '<div class="live-block"><div class="live-header"><div class="section-title" style="border:none;margin:0;padding:0;">Performance History</div>' +
        '<div class="live-stats">' + escapeHTML(stats) + '</div></div><div class="live-timeline"><div class="live-timeline-inner">' +
        lh.map(function(l) {
          return '<div class="live-node ' + (l.has_video ? 'has-video' : 'no-video') + '">' +
            '<div class="live-date">' + escapeHTML(songModalStripTime(l.date)) + '</div>' +
            (l.has_video && l.video_url
              ? '<a class="live-name" href="' + escapeHTML(l.video_url) + '" target="_blank" rel="noopener">' + escapeHTML(l.name) + '</a>'
              : '<span class="live-name">' + escapeHTML(l.name) + '</span>') +
            (l.venue ? '<div class="live-venue">' + escapeHTML(l.venue) + '</div>' : "") +
          '</div>';
        }).join("") + '</div></div></div>';
    }

    songModalRight.innerHTML = rightHTML || '<div style="color:#555;text-align:center;padding:40px;">暂无更多信息</div>';

    songModalOverlay.classList.add("open");
    cachedSongModalIndex = index;
  };

  function closeSongModal() {
    songModalOverlay.classList.remove("open");
    document.body.style.overflow = "";
    if (window._drawerWasActive) {
      drawerOverlay.classList.add("active");
      document.body.style.overflow = "hidden";
    }
  }

  songModalClose.addEventListener("click", closeSongModal);
  songModalOverlay.addEventListener("click", function(e) {
    if (e.target === songModalOverlay) closeSongModal();
  });

  buildLiveFilter();
  renderGallery();

  // 哈希自动打开：/live/index.html#live=LIVE_NAME
  if (window.location.hash.startsWith('#live=')) {
    const liveName = decodeURIComponent(window.location.hash.slice(6));
    const idx = livesData.findIndex(l => l.name === liveName);
    if (idx >= 0) setTimeout(function() { openDrawer(idx); }, 200);
  }

  // ==================== 数据统计 ====================
  function openStats() {
    const overlay = document.getElementById("statsOverlay");
    const body = document.getElementById("statsBody");
    overlay.classList.add("active");
    document.body.style.overflow = "hidden";
    body.scrollTop = 0;
    renderStats();
  }

  function closeStats() {
    document.getElementById("statsOverlay").classList.remove("active");
    document.body.style.overflow = "";
  }
  window.closeStats = closeStats;

  document.getElementById("statsCloseBtn").addEventListener("click", closeStats);
  document.getElementById("statsOverlay").addEventListener("click", function(e) {
    if (e.target === this) closeStats();
  });

  document.addEventListener("keydown", function(e) {
    if (e.key === "Escape" && document.getElementById("statsOverlay").classList.contains("active")) {
      closeStats();
    }
  });

  function renderStats() {
    const body = document.getElementById("statsBody");
    if (!livesData || !songsData) {
      body.innerHTML = '<div class="stats-loading">No data available</div>';
      return;
    }

    // ---- 计算所有统计 ----
    const allTracks = []; // {title, date, liveName, num, isSong}
    const songCount = {}; // title -> count
    const songDates = {}; // title -> [dates]
    const songLastDate = {}; // title -> last date
    const openers = {}; // title -> count
    const closers = {}; // title -> count
    const combos = {}; // "A → B" -> count
    const liveMonths = {}; // "YYYY-MM" -> count

    const nonSongLabels = new Set(["intro", "interlude", "story movie", "opening", "ending", "encore", "mc", "talk"]);

    function isSong(entry) {
      if (!entry.num || !entry.num.match(/^M\d/)) return false;
      const label = (entry.highlight_label || "").toLowerCase();
      if (nonSongLabels.has(label)) return false;
      const title = (entry.title || "").toLowerCase();
      if (nonSongLabels.has(title)) return false;
      return true;
    }

    // 歌曲名 → type 映射（用于排除 Cover）
    const songTypeMap = {};
    songsData.forEach(s => {
      const name = s.name_jp || s.name;
      if (name) songTypeMap[name] = (s.type || "").toLowerCase();
    });

    livesData.forEach(live => {
      const tracks = live.setlist || [];
      const date = live.date || "";
      const liveName = live.name || "";

      // 收集歌曲
      const songTracks = tracks.filter(t => isSong(t));
      songTracks.forEach(t => {
        const title = t.title;
        allTracks.push({ title, date, liveName, num: t.num });
        songCount[title] = (songCount[title] || 0) + 1;
        if (!songDates[title]) songDates[title] = [];
        songDates[title].push(date);
      });

      // 开场曲（第一条 Mxx）
      if (songTracks.length > 0) {
        const opener = songTracks[0].title;
        openers[opener] = (openers[opener] || 0) + 1;
      }

      // 结尾曲（最后一条 Mxx）
      if (songTracks.length > 0) {
        const closer = songTracks[songTracks.length - 1].title;
        closers[closer] = (closers[closer] || 0) + 1;
      }

      // 连唱组合
      for (let i = 0; i < songTracks.length - 1; i++) {
        const key = songTracks[i].title + " → " + songTracks[i + 1].title;
        combos[key] = (combos[key] || 0) + 1;
      }

      // 活跃度热力图
      const m = date.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
      if (m) {
        const ym = m[1] + "-" + m[2].padStart(2, "0");
        liveMonths[ym] = (liveMonths[ym] || 0) + 1;
      }

      // 歌曲最后演出日期
      songTracks.forEach(t => {
        songLastDate[t.title] = date;
      });
    });

    // Top 10
    const top10 = Object.entries(songCount)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 10);

    // 开场 Top 5
    const topOpeners = Object.entries(openers)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 5);

    // 结尾 Top 5
    const topClosers = Object.entries(closers)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 5);

    // 连唱 Top 8
    const topCombos = Object.entries(combos)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 8);

    // 已发行但从未演出
    const playedTitles = new Set(Object.keys(songCount));
    const neverPlayed = songsData.filter(s => {
      const name = s.name_jp || s.name;
      return name && !playedTitles.has(name);
    });

    // 距上次演出间隔最长（只考虑有演出记录的歌曲）
    function parseDate(d) {
      if (!d) return 0;
      const m = d.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
      return m ? new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3])) : 0;
    }

    function computeGaps() {
      const now = new Date();
      return Object.entries(songLastDate)
        .map(([title, lastDate]) => {
          const type = songTypeMap[title];
          if (type === "cover" || type === undefined) return null;
          const d = parseDate(lastDate);
          if (!d) return null;
          const days = Math.floor((now - d) / (1000 * 60 * 60 * 24));
          return { title, lastDate, days };
        })
        .filter(Boolean)
        .sort((a, b) => b.days - a.days)
        .slice(0, 8);
    }

    // ---- 热力图数据 ----
    const yearSet = new Set();
    Object.keys(liveMonths).forEach(ym => {
      const y = ym.split("-")[0];
      yearSet.add(y);
    });
    const years = [...yearSet].sort();
    const months = ["01","02","03","04","05","06","07","08","09","10","11","12"];
    const maxCount = Math.max(1, ...Object.values(liveMonths));

    // ---- 渲染 ----
    function buildHTML() {
      const gaps = computeGaps();
      let html = "";

      // Section 1: Top 10 柱状图
      html += '<div class="stats-section">';
      html += '<h3 class="stats-section-title">Most Played Songs</h3>';
      html += '<div class="stats-chart-wrap"><canvas id="top10Chart"></canvas></div>';
      html += '</div>';

      // Section 2: 开场/结尾
      html += '<div class="stats-section">';
      html += '<h3 class="stats-section-title">Top Openers &amp; Closers</h3>';
      html += '<div class="stats-row">';
      html += '<div class="stats-col">';
      html += '<h4 class="stats-subtitle">🎬 Most Frequent Openers</h4>';
      html += '<ul class="stats-list">';
      topOpeners.forEach(([title, count]) => {
        html += '<li><span class="stats-song">' + title + '</span><span class="stats-count">' + count + '</span></li>';
      });
      html += '</ul></div>';
      html += '<div class="stats-col">';
      html += '<h4 class="stats-subtitle">🎭 Most Frequent Closers</h4>';
      html += '<ul class="stats-list">';
      topClosers.forEach(([title, count]) => {
        html += '<li><span class="stats-song">' + title + '</span><span class="stats-count">' + count + '</span></li>';
      });
      html += '</ul></div>';
      html += '</div></div>';

      // Section 3: 遗珠 & 有生之年
      html += '<div class="stats-section">';
      html += '<h3 class="stats-section-title">Rarities &amp; Unplayed Tracks</h3>';
      html += '<div class="stats-row">';
      html += '<div class="stats-col">';
      html += '<h4 class="stats-subtitle">⏳ Longest Gap Since Last Played</h4>';
      html += '<ul class="stats-list">';
      gaps.forEach(({ title, lastDate, days }) => {
        html += '<li><span class="stats-song">' + title + '</span><span class="stats-count">' + days + ' days</span><span class="stats-date">' + lastDate + '</span></li>';
      });
      html += '</ul></div>';
      html += '<div class="stats-col">';
      html += '<h4 class="stats-subtitle">💎 Released but Never Played Live</h4>';
      html += '<ul class="stats-list">';
      if (neverPlayed.length > 0) {
        neverPlayed.forEach(s => {
          const name = s.name_jp || s.name;
          html += '<li><span class="stats-song">' + name + '</span><span class="stats-date">' + (s.release_date || "") + '</span></li>';
        });
      } else {
        html += '<li class="stats-empty">All songs have been performed ✓</li>';
      }
      html += '</ul></div>';
      html += '</div></div>';

      // Section 4: 连唱绑定
      html += '<div class="stats-section">';
      html += '<h3 class="stats-section-title">Frequent Combos</h3>';
      html += '<ul class="stats-combo-list">';
      topCombos.forEach(([combo, count]) => {
        html += '<li><span class="combo-arrow">' + combo + '</span><span class="stats-count">' + count + '</span></li>';
      });
      html += '</ul></div>';

      // Section 5: 活跃度热力图
      html += '<div class="stats-section">';
      html += '<h3 class="stats-section-title">Activity Heatmap</h3>';
      html += '<div class="heatmap-wrap">';
      html += '<div class="heatmap-grid">';
      html += '<div class="heatmap-label-col"><span></span>';
      months.forEach(m => {
        html += '<span>' + m + '</span>';
      });
      html += '</div>';
      years.forEach(y => {
        html += '<div class="heatmap-row">';
        html += '<span class="heatmap-year">' + y + '</span>';
        months.forEach(m => {
          const key = y + "-" + m;
          const count = liveMonths[key] || 0;
          const level = count === 0 ? 0 : Math.ceil((count / maxCount) * 4);
          html += '<span class="heatmap-cell level-' + level + '" title="' + key + ": " + count + ' lives"></span>';
        });
        html += '</div>';
      });
      html += '</div>';
      html += '<div class="heatmap-legend"><span class="heatmap-cell level-0"></span> 0 <span class="heatmap-cell level-1"></span> 1 <span class="heatmap-cell level-2"></span> 2 <span class="heatmap-cell level-3"></span> 3 <span class="heatmap-cell level-4"></span> ' + maxCount + '+</div>';
      html += '</div></div>';

      return html;
    }

    body.innerHTML = buildHTML();

    // 绘制 Chart.js 柱状图
    setTimeout(() => {
      const ctx = document.getElementById("top10Chart");
      if (!ctx) return;
      new Chart(ctx, {
        type: "bar",
        data: {
          labels: top10.map(t => t[0]),
          datasets: [{
            label: "演出次数",
            data: top10.map(t => t[1]),
            backgroundColor: "rgba(204, 41, 41, 0.6)",
            borderColor: "rgba(204, 41, 41, 0.9)",
            borderWidth: 1,
            borderRadius: 4
          }]
        },
        options: {
          indexAxis: "y",
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          scales: {
            x: {
              ticks: { color: "#888", stepSize: 1 },
              grid: { color: "rgba(255,255,255,0.04)" }
            },
            y: {
              ticks: { color: "#ccc", font: { size: 12 } },
              grid: { display: false }
            }
          }
        }
      });
    }, 100);
  }
})();
  </script>
</body>
</html>
