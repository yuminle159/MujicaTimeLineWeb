<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../favicon.ico">
  <title>Live · 唯鸡百科</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;500;600;700&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=202609081844">
</head>
<body>
  <div class="live-page">
    <header class="page-header">
      <a class="back-nav" href="../index.html">← 返回主页</a>
      <h1>Live</h1>
    </header>

    <div class="filter-bar" id="liveFilterBar"></div>

    <main class="gallery-container" id="gallery">
      <div class="no-results" id="noResults" style="display:none">没有找到匹配的演唱会</div>
    </main>
  </div>

  <!-- 抽屉详情 -->
  <div id="liveDrawer" class="drawer-overlay" onclick="closeDrawer(event)">
    <div class="drawer" onclick="event.stopPropagation()">
      <button class="close-btn" onclick="closeDrawer(event)">&times;</button>
      <div class="drawer-body" id="drawerBody"></div>
    </div>
  </div>

  <!-- Song 详情模态框（嵌入，用于 setlist 点击） -->
  <div class="song-modal-overlay" id="songModalOverlay">
    <div class="song-modal-container" id="songModalContainer">
      <button class="song-modal-close" id="songModalClose">&times;</button>
      <div class="song-modal-left" id="songModalLeft"></div>
      <div class="song-modal-right" id="songModalRight"></div>
    </div>
  </div>

  <!-- MC 弹窗 -->
  <div id="mcModal" class="mc-modal" onclick="closeMcModal()">
    <div class="mc-modal-container" onclick="event.stopPropagation()">
      <button class="mc-modal-close" onclick="closeMcModal()">&times;</button>
      <div class="mc-modal-body" id="mcModalBody"></div>
    </div>
  </div>

  <!-- KV 全图灯箱 -->
  <div id="kvLightbox" class="kv-lightbox" onclick="closeKvLightbox()">
    <button class="kv-lightbox-close" onclick="closeKvLightbox()">&times;</button>
    <button class="kv-lightbox-arrow kv-lightbox-prev" onclick="event.stopPropagation();moveKvLightbox(-1)">&#10094;</button>
    <img id="kvLightboxImg" src="" alt="" onclick="event.stopPropagation();toggleKvHud()">
    <div class="kv-lightbox-hud" id="kvLightboxHud" onclick="event.stopPropagation()">
      <div class="hud-info-block">
        <div class="hud-title" id="hudTitle"></div>
        <div class="hud-desc" id="hudDesc"></div>
      </div>
      <div class="hud-right">
        <a class="hud-source-btn" id="hudSourceBtn" href="#" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="display:none">↗ SOURCE</a>
        <div class="hud-counter" id="hudCounter">
          <span class="counter-label">FILE_</span>
          <span class="counter-num" id="hudCounterNum"></span>
        </div>
      </div>
    </div>
    <button class="kv-lightbox-arrow kv-lightbox-next" onclick="event.stopPropagation();moveKvLightbox(1)">&#10095;</button>
  </div>

  <!-- 数据统计浮窗（全屏） -->
  <div id="statsOverlay" class="stats-overlay">
    <div class="stats-header">
      <div class="stats-title-block">
        <div class="stats-file-id">FILE // LIVE_STATISTICS</div>
        <h2>Live Statistics</h2>
        <div class="stats-subtitle">PERFORMANCE RECORDS &amp; SETLIST ANALYSIS</div>
      </div>
      <button class="stats-close" id="statsCloseBtn" onclick="closeStats()">&times;</button>
    </div>
    <div class="stats-control-deck">
      <div class="stats-filters" id="statsScopes">
        <button class="stats-chip active" data-scope="all">ALL</button>
        <button class="stats-chip" data-scope="one-man">ONE MAN</button>
        <button class="stats-chip" data-scope="fes">FES</button>
        <button class="stats-chip" data-scope="bandori">BANG DREAM!</button>
      </div>
      <div class="stats-tabs" id="statsTabs">
        <button class="stats-tab active" data-view="overview">OVERVIEW</button>
        <button class="stats-tab" data-view="evolution">SETLIST EVOLUTION</button>
        <button class="stats-tab" data-view="compare">LIVE COMPARISON</button>
        <button class="stats-tab" data-view="repertoire">REPERTOIRE STATUS</button>
      </div>
    </div>
    <div class="stats-body" id="statsBody">
      <div class="stats-loading">Loading statistics...</div>
    </div>
  </div>

  <script src="../songs/data.js?v=202609081844"></script>
  <script src="data.js?v=202609081844"></script>
  <script src="../js/renderMarkdown.js?v=202609081844"></script>
  <script>
(function() {
  const gallery = document.getElementById("gallery");
  const noResults = document.getElementById("noResults");
  const drawerOverlay = document.getElementById("liveDrawer");
  const drawerBody = document.getElementById("drawerBody");
  let cachedLiveIndex = -1;  // 缓存已渲染的演唱会，避免重复构建

  // 歌曲名→索引 查找表（用于 setlist 点击跳转）
  const songLookup = {};
  if (typeof livesData !== "undefined") {
    // 解析日期为可比较数值（处理 YYYY/M/D 和 YYYY-M-D 格式）
    function parseDateStamp(d) {
      if (!d) return 0;
      const m = d.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
      return m ? parseInt(m[1]) * 10000 + parseInt(m[2]) * 100 + parseInt(m[3]) : 0;
    }
    livesData.sort((a, b) => parseDateStamp(a.date) - parseDateStamp(b.date));
    songsData.forEach((s, i) => { if (s.name_jp) songLookup[s.name_jp] = i; });
  }

  // MC 弹窗
  window._mcContentMap = {};
  window.closeMcModal = function() {
    document.getElementById("mcModal").classList.remove("active");
    document.body.style.overflow = "";
  };
  window.openMcModal = function(key) {
    const mcContent = window._mcContentMap[key];
    document.getElementById("mcModalBody").innerHTML = renderMarkdown(mcContent, { mode: "mc" });
    document.getElementById("mcModal").classList.add("active");
    document.body.style.overflow = "hidden";
  };

  function escapeHTML(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  function stripTime(dateStr) {
    if (!dateStr) return "";
    return dateStr.replace(/\s[\d:]+$/, "").trim();
  }

  // ===== 筛选 =====
  let activeLiveTag = null;
  let liveSortReverse = false;

  function buildLiveFilter() {
    const bar = document.getElementById("liveFilterBar");
    if (!bar) return;
    // 收集所有唯一的 tag
    const tags = new Set();
    livesData.forEach(l => { if (l.tag) tags.add(l.tag); });
    if (tags.size === 0) return;

    let html = '<div class="filter-group"><button class="main-tag active" data-tag=""><span class="diamond">◆</span> ALL</button></div>';
    const sorted = [...tags].sort();
    sorted.forEach((t) => {
      html += '<div class="separator"></div>';
      html += '<div class="filter-group"><button class="main-tag" data-tag="' + escapeHTML(t) + '"><span class="diamond">◆</span> ' + escapeHTML(t) + '</button></div>';
    });
    bar.innerHTML = html;

    bar.querySelectorAll(".main-tag").forEach(btn => {
      btn.addEventListener("click", function() {
        bar.querySelectorAll(".main-tag").forEach(b => b.classList.remove("active"));
        this.classList.add("active");
        activeLiveTag = this.getAttribute("data-tag") || null;
        renderGallery();
      });
    });

    // 数据统计按钮（放在排序按钮左边，紧靠）
    const statsBtn = document.createElement("button");
    statsBtn.className = "sort-btn";
    statsBtn.textContent = "数据统计";
    statsBtn.style.marginRight = "6px";
    statsBtn.addEventListener("click", openStats);
    bar.appendChild(statsBtn);

    // 排序按钮
    const sortBtn = document.createElement("button");
    sortBtn.className = "sort-btn";
    sortBtn.style.marginLeft = "0";
    sortBtn.innerHTML = '<span>时间倒序</span>';
    sortBtn.addEventListener("click", () => {
      liveSortReverse = !liveSortReverse;
      sortBtn.innerHTML = liveSortReverse ? '<span>时间正序</span>' : '<span>时间倒序</span>';
      renderGallery();
    });
    bar.appendChild(sortBtn);
  }

  // ===== 渲染画廊 =====
  function renderGallery() {
    gallery.innerHTML = "";
    let filtered = livesData;
    if (activeLiveTag) {
      filtered = livesData.filter(l => l.tag === activeLiveTag);
    }
    if (filtered.length === 0) {
      noResults.style.display = "block";
      return;
    }
    noResults.style.display = "none";

    // 按日期排列
    filtered.sort((a, b) => {
      const cmp = parseDateStamp(a.date) - parseDateStamp(b.date);
      return liveSortReverse ? -cmp : cmp;
    });

    filtered.forEach((live, i) => {
      // 使用原始索引以便打开抽屉
      const origIdx = livesData.indexOf(live);
      const card = document.createElement("article");
      card.className = "live-card";
      card.innerHTML = `
        <div class="card-image${live.tag ? ' tag-' + live.tag.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/-+$/, '') : ''}" onclick="openDrawer(${origIdx})">
          ${live.poster ? `<img src="${escapeHTML(live.poster)}" alt="${escapeHTML(live.name)}" loading="lazy">` : '<div class="card-placeholder"></div>'}
        </div>
        <div class="card-info" onclick="openDrawer(${origIdx})">
          <div class="card-date">${stripTime(escapeHTML(live.date))}</div>
          <h2 class="card-title">${escapeHTML(live.name)}</h2>
          <div class="card-meta-row">${live.tag ? `<span class="card-tag">${escapeHTML(live.tag)}</span>` : ""}<span class="card-venue">${escapeHTML(live.venue)}</span></div>
        </div>`;
      gallery.appendChild(card);
    });
  }

  // ===== 打开抽屉 =====
  window.openDrawer = function(index) {
    const live = livesData[index];
    if (!live) return;
    if (cachedLiveIndex === index) {
      drawerOverlay.classList.add("active");
      document.body.style.overflow = "hidden";
      history.replaceState(null, '', '#live=' + live.hash_id);
      return;
    }
    document.body.style.overflow = "hidden";

    // 曲目列表
    let setlistHTML = "";
    if (live.setlist && live.setlist.length) {
      setlistHTML = `<div class="col-setlist">
        <h3 class="section-title">Setlist</h3>
        <ul class="setlist-list">`;
      live.setlist.forEach((track, j) => {
        const num = track.num || "&nbsp;&nbsp;";
        const songIdx = (track.title !== "Interlude") ? songLookup[track.title] : undefined;
        const hasMc = !!(track.mc_content);
        const clickable = (songIdx !== undefined) || hasMc;
        const labelClass = track.highlight_label ? ` highlight-${track.highlight_label.toLowerCase().replace(/\s+/g, '-')}` : "";
        let clickAttr = "";
        if (songIdx !== undefined) {
          clickAttr = `onclick="event.stopPropagation();openSongModal(${songIdx})"`;
        } else if (hasMc) {
          const mcKey = `mc_${index}_${j}`;
          window._mcContentMap[mcKey] = track.mc_content;
          clickAttr = `onclick="event.stopPropagation();openMcModal('${mcKey}')"`;
        }
        // 眼睛图标：仅当 link 有效（非空、非0、以http开头）时显示
        const linkUrl = (track.link && track.link !== "0" && /^https?:\/\//i.test(track.link)) ? track.link : "";
        const eyeIcon = linkUrl ? `<svg class="track-link-eye" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" onclick="event.stopPropagation();window.open('${escapeHTML(linkUrl)}', '_blank')" title="查看来源"><path class="eye-almond" d="M16,24 Q24,17 32,24 Q24,31 16,24"/><circle class="eye-pupil" cx="24" cy="24" r="3"/></svg>` : "";
        setlistHTML += `<li class="setlist-item${clickable ? ' setlist-clickable' : ''}">
          <div class="track-info">
            <span class="track-num">${num}</span>
            <span class="track-title"${clickAttr}>${escapeHTML(track.title)}${clickable ? ' <span class="track-link-icon">↗</span>' : ''}</span>
            ${eyeIcon}
            <span class="track-highlight${labelClass}"${track.highlight_text ? ` data-tooltip="${escapeHTML(track.highlight_text).replace(/"/g, '&quot;').replace(/\\n/g, '&#10;')}"` : ""}>${track.highlight_label ? `<span class="highlight-badge">${escapeHTML(track.highlight_label)}</span>` : ""}${track.highlight_text ? `<span class="highlight-desc">${escapeHTML(track.highlight_text).replace(/\\n/g, "<br>")}</span>` : ""}</span>
          </div>
        </li>`;
      });
      setlistHTML += `</ul></div>`;
    }

    // 幕后照片（按 group_id 分组，同组照片使用轮播）
    let backstageHTML = "";
    window._backstageGroups = null;
    if (live.backstage && live.backstage.length) {
      // 分组：无 group_id 的独立显示，相同 group_id 的归入一组
      const groups = [];
      let currentGroup = null;
      live.backstage.forEach(photo => {
        const gid = photo.group_id || "";
        if (!gid) {
          groups.push({ photos: [photo], credit: photo.credit, credit_text: photo.credit_text, source_url: photo.source_url, source_label: photo.source_label });
        } else if (currentGroup && currentGroup.id === gid) {
          currentGroup.photos.push(photo);
        } else {
          currentGroup = { id: gid, photos: [photo], credit: photo.credit, credit_text: photo.credit_text, source_url: photo.source_url, source_label: photo.source_label };
          groups.push(currentGroup);
        }
      });
      // 存储到全局以便 lightbox 轮播使用
      window._backstageGroups = groups;

      backstageHTML = `<div class="col-gallery">
        <h3 class="section-title">Backstage</h3>
        <div class="photo-grid">`;
      groups.forEach((group, gi) => {
        const firstPhoto = group.photos[0];
        const photoUrls = group.photos.map(p => p.photo);
        const photoCredits = group.photos.map(p => p.credit || group.credit || "");
        const photoCreditTexts = group.photos.map(p => p.credit_text || "");
        const photoSourceUrls = group.photos.map(p => p.source_url || group.source_url || "");
        const photoSourceLabels = group.photos.map(p => p.source_label || group.source_label || "");
        const multiBadge = group.photos.length > 1 ? `<span class="multi-badge">+${group.photos.length - 1}</span>` : "";
        backstageHTML += `<div class="photo-card">
          <img src="${escapeHTML(firstPhoto.photo)}" alt="${escapeHTML(group.credit || '')}" onclick="openKvLightbox('${escapeHTML(firstPhoto.photo)}', ${JSON.stringify(photoUrls).replace(/"/g, '&quot;')}, 0, ${JSON.stringify(photoCredits).replace(/"/g, '&quot;')}, ${JSON.stringify(photoCreditTexts).replace(/"/g, '&quot;')}, ${JSON.stringify(photoSourceUrls).replace(/"/g, '&quot;')}, ${JSON.stringify(photoSourceLabels).replace(/"/g, '&quot;')})">
          ${group.credit ? `<span class="credit-tag">${escapeHTML(group.credit)}</span>` : ""}
          ${multiBadge}
        </div>`;
      });
      backstageHTML += `</div></div>`;
    }

    drawerBody.innerHTML = `
      <div class="drawer-hero">
        ${live.kv ? `<img class="hero-poster" src="${escapeHTML(live.kv)}" alt="${escapeHTML(live.name)}" onclick="openKvLightbox('${escapeHTML(live.kv)}')">` : (live.poster ? `<img class="hero-poster" src="${escapeHTML(live.poster)}" alt="${escapeHTML(live.name)}">` : "")}
        <div class="hero-info">
          <div class="hero-date">${stripTime(escapeHTML(live.date))}</div>
          <h1 class="hero-title">${escapeHTML(live.name)}</h1>
          <div class="hero-meta-row">${live.tag ? '🎵 <span class="hero-tag">' + escapeHTML(live.tag) + '</span>' : ""}${live.venue ? ' 📍 ' + escapeHTML(live.venue) : ""}</div>
          <div class="hero-action-row">
            ${live.video_url ? `<a href="${escapeHTML(live.video_url)}" class="btn-play" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              WATCH ARCHIVE
            </a>` : `<span class="btn-unrecorded">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              UNRECORDED
            </span>`}
            ${live.description ? `<span class="hero-desc">${escapeHTML(live.description)}</span>` : ""}
          </div>
        </div>
      </div>
      <div class="drawer-content">
        ${setlistHTML}
        ${backstageHTML}
      </div>`;

    drawerOverlay.classList.add("active");
    cachedLiveIndex = index;
    history.replaceState(null, '', '#live=' + live.hash_id);

    // 预加载当前抽屉所有 backstage 图片（缩略图已渲染，此处预加载灯箱大图）
    const groups = window._backstageGroups;
    if (groups && groups.length) {
      groups.forEach(group => {
        group.photos.forEach(photo => {
          const img = new Image();
          img.src = photo.photo;
        });
      });
    }
  };

  // ===== 关闭抽屉 =====
  window.closeDrawer = function(event) {
    if (event.target === drawerOverlay || event.target.classList.contains("close-btn")) {
      drawerOverlay.classList.remove("active");
      document.body.style.overflow = "";
      history.replaceState(null, '', window.location.pathname + window.location.search);
    }
  };

  // ===== 键盘 ESC 关闭 =====
  document.addEventListener("keydown", function(e) {
    if (e.key === "Escape") {
      const mcModal = document.getElementById("mcModal");
      if (mcModal && mcModal.classList.contains("active")) {
        closeMcModal();
        return;
      }
      if (songModalOverlay.classList.contains("open")) {
        closeSongModal();
        return;
      }
      if (drawerOverlay.classList.contains("active")) {
        drawerOverlay.classList.remove("active");
        document.body.style.overflow = "";
        history.replaceState(null, '', window.location.pathname + window.location.search);
      }
      if (document.getElementById("kvLightbox").classList.contains("active")) {
        closeKvLightbox();
      }
    }
    if (document.getElementById("kvLightbox").classList.contains("active")) {
      if (e.key === "ArrowLeft") moveKvLightbox(-1);
      if (e.key === "ArrowRight") moveKvLightbox(1);
    }
  });

  // ===== KV 全图灯箱 =====
  let kvGroup = null;
  let kvIndex = 0;
  let kvCredits = [];
  let kvCreditTexts = [];
  let kvSourceUrls = [];
  let kvSourceLabels = [];
  function updateKvHud(idx) {
    const hudTitle = document.getElementById("hudTitle");
    const hudDesc = document.getElementById("hudDesc");
    const hudSourceBtn = document.getElementById("hudSourceBtn");
    const hudCounterNum = document.getElementById("hudCounterNum");
    hudTitle.textContent = kvCredits[idx] || "";
    hudDesc.textContent = kvCreditTexts[idx] || "";
    hudCounterNum.textContent = "[ " + (idx + 1) + " / " + kvGroup.length + " ]";
    const sl = (kvSourceLabels[idx] || "").trim().toLowerCase();
    if (sl === "yes" && kvSourceUrls[idx]) {
      hudSourceBtn.href = kvSourceUrls[idx];
      hudSourceBtn.style.display = "flex";
    } else {
      hudSourceBtn.style.display = "none";
    }
  }
  window.openKvLightbox = function(src, group, index, credits, creditTexts, sourceUrls, sourceLabels) {
    kvGroup = (group && group.length > 0) ? group : null;
    kvIndex = (index !== undefined) ? index : 0;
    kvCredits = credits || [];
    kvCreditTexts = creditTexts || [];
    kvSourceUrls = sourceUrls || [];
    kvSourceLabels = sourceLabels || [];
    const lb = document.getElementById("kvLightbox");
    const img = document.getElementById("kvLightboxImg");
    const hud = document.getElementById("kvLightboxHud");
    const hudCounter = document.getElementById("hudCounter");
    img.src = (kvGroup ? kvGroup[kvIndex] : src);
    if (kvGroup) {
      hud.classList.remove("hidden");
      updateKvHud(kvIndex);
      hudCounter.style.display = "flex";
      document.querySelectorAll(".kv-lightbox-arrow").forEach(a => a.style.display = "flex");
    } else {
      hud.classList.add("hidden");
      hudCounter.style.display = "none";
      document.getElementById("hudSourceBtn").style.display = "none";
      document.querySelectorAll(".kv-lightbox-arrow").forEach(a => a.style.display = "none");
    }
    lb.classList.add("active");
    document.body.style.overflow = "hidden";
    img.style.opacity = "0";
    img.onload = () => { img.style.opacity = "1"; };
  };
  window.moveKvLightbox = function(direction) {
    if (!kvGroup) return;
    kvIndex = ((kvIndex + direction) % kvGroup.length + kvGroup.length) % kvGroup.length;
    const img = document.getElementById("kvLightboxImg");
    img.style.opacity = "0";
    img.src = "";
    requestAnimationFrame(() => {
      img.src = kvGroup[kvIndex];
      img.onload = () => { img.style.opacity = "1"; };
    });
    updateKvHud(kvIndex);
  };
  window.closeKvLightbox = function() {
    const lb = document.getElementById("kvLightbox");
    lb.classList.remove("active");
    document.body.style.overflow = "";
    kvGroup = null;
    kvIndex = 0;
  };
  window.toggleKvHud = function() {
    if (!kvGroup) return;
    const hud = document.getElementById("kvLightboxHud");
    hud.classList.toggle("hidden");
  };

  // ===== Backstage 轮播控制器 =====
  window.moveCarousel = function(gi, direction) {
    const track = document.getElementById("carouselTrack_" + gi);
    const counter = document.getElementById("carouselCounter_" + gi);
    if (!track) return;
    const imgs = track.querySelectorAll("img");
    if (imgs.length === 0) return;
    let activeIdx = -1;
    imgs.forEach((img, i) => { if (img.classList.contains("active")) activeIdx = i; });
    const newIdx = ((activeIdx + direction) % imgs.length + imgs.length) % imgs.length;
    imgs.forEach((img, i) => { img.classList.toggle("active", i === newIdx); });
    if (counter) counter.textContent = (newIdx + 1) + " / " + imgs.length;
  };

  // ===== Highlight 气泡 =====
  let bubbleEl = null;
  let bubbleTimer = null;
  document.addEventListener("mouseover", function(e) {
    const trackInfo = e.target.closest(".track-info");
    if (!trackInfo) return;
    const highlight = trackInfo.querySelector(".track-highlight[data-tooltip]");
    if (!highlight) return;
    const tooltip = highlight.getAttribute("data-tooltip");
    if (!tooltip) return;
    clearTimeout(bubbleTimer);
    if (!bubbleEl) {
      bubbleEl = document.createElement("div");
      bubbleEl.className = "highlight-bubble";
      document.body.appendChild(bubbleEl);
    }
    bubbleEl.textContent = tooltip;
    bubbleEl.classList.add("show");
    const rect = highlight.getBoundingClientRect();
    bubbleEl.style.left = rect.left + "px";
    bubbleEl.style.top = (rect.top - 8) + "px";
    bubbleEl.style.transform = "translateY(-100%)";
  });
  document.addEventListener("mouseout", function(e) {
    const trackInfo = e.target.closest(".track-info");
    if (trackInfo && e.relatedTarget && trackInfo.contains(e.relatedTarget)) return;
    if (bubbleEl) {
      bubbleTimer = setTimeout(function() {
        if (!bubbleEl) return;
        // 二次确认：鼠标是否真的离开了所有 highlight
        const hovered = document.querySelector(".track-info:hover .track-highlight[data-tooltip]");

  // ===== Song 详情模态框（嵌入） =====
  const songModalOverlay = document.getElementById("songModalOverlay");
  const songModalLeft = document.getElementById("songModalLeft");
  const songModalRight = document.getElementById("songModalRight");
  const songModalClose = document.getElementById("songModalClose");
  let cachedSongModalIndex = -1;
  let songModalComments = null;

  function songModalStripTime(dateStr) {

  window.switchSongComment = function(index) {

  window.openSongModal = function(index) {

        (song.album ? '<div><span class="song-meta-label">首发形式</span> <span class="song-meta-value">' + escapeHTML(song.album) + '</span></div>' : "") +
        (song.lyricist ? '<div><span class="song-meta-label">作词</span> <span class="song-meta-value">' + escapeHTML(song.lyricist) + '</span></div>' : "") +
        (song.composer ? '<div><span class="song-meta-label">作曲</span> <span class="song-meta-value">' + escapeHTML(song.composer) + '</span></div>' : "") +
        (song.arranger ? '<div><span class="song-meta-label">编曲</span> <span class="song-meta-value">' + escapeHTML(song.arranger) + '</span></div>' : "") +
        (song.first_stage ? '<div><span class="song-meta-label">首次登台</span> <span class="song-meta-value">' + escapeHTML(song.first_stage) + '</span></div>' : "") +
        (song.mv_url ? '<div><span class="song-meta-label">MV链接</span> <a class="song-meta-link" href="' + escapeHTML(song.mv_url) + '" target="_blank" rel="noopener">观看 MV &#8599;</a></div>' : "") +
        (song.appearances && song.appearances.length ? '<div style="margin-top:12px;"><span class="song-meta-label">收录CD</span><div class="song-appearances-list">' + song.appearances.map(function(a) { return '<span class="song-cd-item"><span class="song-cd-icon"></span><span>' + escapeHTML(a) + '</span></span>'; }).join("") + '</div></div>' : "") +
      '</div>';

    let rightHTML = "";

        tabsHTML += '<span class="song-comment-tab' + (i === 0 ? ' active' : '') + '" onclick="event.stopPropagation();switchSongComment(' + i + ')">' + escapeHTML(c.from || 'Comment ' + (i + 1)) + '</span>';
      });

      var first = song.comments[0];
      rightHTML += '<div class="song-commentary-block">' +
        '<div class="song-commentary-header"><div class="song-section-title">Comment</div>' + tabsHTML + '</div>' +
        '<div class="song-commentary-body"><div class="song-commentary-text" id="songCommentaryText">' + (first.date ? '<div class="song-comment-date">' + escapeHTML(first.date) + '</div>' : '') + escapeHTML(first.text).replace(/\\n/g, "<br>") + '</div></div></div>';
    }

    if (song.lyrics_jp || song.lyrics_cn) {
      var jpLines = (song.lyrics_jp || "").split("\\n");
      var cnLines = (song.lyrics_cn || "").split("\\n");
      var maxLen = Math.max(jpLines.length, cnLines.length);
      var lyricsRows = "";
      for (var i = 0; i < maxLen; i++) {
        var jp = i < jpLines.length ? escapeHTML(jpLines[i]) : "";
        var cn = i < cnLines.length ? escapeHTML(cnLines[i]) : "";
        lyricsRows += '<div class="song-lyrics-row"><span class="song-lyrics-jp">' + jp + '</span><span class="song-lyrics-cn">' + cn + '</span></div>';
      }
      rightHTML += '<div class="song-lyrics-block"><div class="song-lyrics-header"><div class="song-section-title" style="border:none;margin:0;padding:0;">Lyrics</div></div>' +
        '<div class="song-lyrics-columns">' + lyricsRows + '</div></div>';
    }

    if (song.live_history && song.live_history.length) {
      var lh = song.live_history;
      var sorted = [].concat(lh).sort(function(a, b) { return (a.date || "").localeCompare(b.date || ""); });
      var firstDate = songModalStripTime(sorted[0] && sorted[0].date || "");
      var lastDate = songModalStripTime(sorted[sorted.length - 1] && sorted[sorted.length - 1].date || "");
      var stats = firstDate + ' ~ ' + lastDate + '，共演奏 ' + lh.length + ' 次';
      rightHTML += '<div class="live-block"><div class="live-header"><div class="section-title" style="border:none;margin:0;padding:0;">Performance History</div>' +
        '<div class="live-stats">' + escapeHTML(stats) + '</div></div><div class="live-timeline"><div class="live-timeline-inner">' +
        lh.map(function(l) {
          return '<div class="live-node ' + (l.has_video ? 'has-video' : 'no-video') + '">' +
            '<div class="live-date">' + escapeHTML(songModalStripTime(l.date)) + '</div>' +
            (l.has_video && l.video_url
              ? '<a class="live-name" href="' + escapeHTML(l.video_url) + '" target="_blank" rel="noopener">' + escapeHTML(l.name) + '</a>'
              : '<span class="live-name">' + escapeHTML(l.name) + '</span>') +
            (l.venue ? '<div class="live-venue">' + escapeHTML(l.venue) + '</div>' : "") +
          '</div>';
        }).join("") + '</div></div></div>';
    }

    songModalRight.innerHTML = rightHTML || '<div style="color:#555;text-align:center;padding:40px;">暂无更多信息</div>';

    songModalOverlay.classList.add("open");
    cachedSongModalIndex = index;
  };

  function closeSongModal() {
    songModalOverlay.classList.remove("open");
    document.body.style.overflow = "";
    if (window._drawerWasActive) {
      drawerOverlay.classList.add("active");
      document.body.style.overflow = "hidden";
    }
  }

  songModalClose.addEventListener("click", closeSongModal);
  songModalOverlay.addEventListener("click", function(e) {
    if (e.target === songModalOverlay) closeSongModal();
  });

  buildLiveFilter();
  renderGallery();

  // 哈希自动打开：/live/index.html#live=HASH_ID
  if (window.location.hash.startsWith('#live=')) {
    const hashId = window.location.hash.slice(6);
    const idx = livesData.findIndex(l => l.hash_id === hashId);
    if (idx >= 0) setTimeout(function() { openDrawer(idx); }, 200);
  }

// ==================== 数据统计 ====================
  // 全屏沉浸式统计浮窗（参考 interview 的 cinematic-overlay + Live Statistics 交互原型）

  function statsScopeOf(live) {
    const t = (live.tag || "").toLowerCase();
    if (t.indexOf("one man") >= 0) return "one-man";
    if (t.indexOf("fes") >= 0) return "fes";
    if (t.indexOf("bang dream") >= 0 || t.indexOf("bandori") >= 0 || t.indexOf("mygo") >= 0) return "bandori";
    return "other";
  }

  function statsNormId(s) { return (s || "").replace(/\s+/g, ""); }

  const STATS_SONG_BY_KEY = {};
  if (typeof songsData !== "undefined") {
    songsData.forEach(s => { if (s.name_jp) STATS_SONG_BY_KEY[statsNormId(s.name_jp)] = s; });
  }
  function statsSongMeta(title) { return STATS_SONG_BY_KEY[statsNormId(title)] || null; }

  function statsIsSong(e) { return !!(e && e.num && /^M\d/.test(e.num)); }

  // 统计只计算原创曲：排除翻唱曲、以及未收录进歌曲库（songs）的曲子（如 Greensleeves）
  function statsIsOriginal(s) { return !!(s && (s.type || "").toLowerCase() !== "cover"); }
  function statsIsCountedSong(e) {
    if (!statsIsSong(e)) return false;
    const meta = statsSongMeta(e.title);
    return !!(meta && statsIsOriginal(meta));
  }

  function statsStampToDate(s) {
    const y = Math.floor(s / 10000), m = Math.floor((s % 10000) / 100), d = s % 100;
    return new Date(y, m - 1, d);
  }
  function statsStampDisplay(s, sep) {
    if (!s) return "—";
    const y = Math.floor(s / 10000), m = Math.floor((s % 10000) / 100), d = s % 100;
    const ss = sep || "/";
    return y + ss + String(m).padStart(2, "0") + ss + String(d).padStart(2, "0");
  }
  function statsDayDiff(a, b) {
    const da = (typeof a === "number") ? statsStampToDate(a) : a;
    const db = (typeof b === "number") ? statsStampToDate(b) : b;
    return Math.round((db - da) / 86400000);
  }
  function statsTodayStamp() {
    const d = new Date();
    return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
  }
  function statsMonthKey(dateStr) {
    const m = (dateStr || "").match(/(\d{4})[\/\-](\d{1,2})/);
    return m ? m[1] + "-" + m[2].padStart(2, "0") : "";
  }
  function statsAttr(s) {
    return escapeHTML(s).replace(/"/g, "&quot;").replace(/\n/g, "&#10;");
  }
  function statsShortName(name) {
    if (!name) return "";
    const n = name.replace(/^Ave Mujica\s*/i, "").trim();
    return n || name;
  }

  const STATS_DORMANT_DAYS = 365;

  // 全局 LIVE DEBUT（每首唯一）：以 setlist 的 highlight_label 标记 "Live debut" 为准，跨全部 Live
  const STATS_DEBUT = {};
  if (typeof livesData !== "undefined") {
    livesData.forEach(live => {
      const s = parseDateStamp(live.date);
      statsSongEntries(live).forEach(e => {
        if (e.isDebut) STATS_DEBUT[e.songId] = { stamp: s, date: live.date, liveName: live.name, live: live };
      });
    });
  }

  let statsScope = "all";
  let statsView = "overview";
  let statsCompareA = null;
  let statsCompareB = null;

  function statsScopedLives() {
    if (statsScope === "all") return livesData.slice();
    return livesData.filter(l => statsScopeOf(l) === statsScope);
  }

  function statsCompleteSetlist(live) {
    const d = (live.description || "").toLowerCase();
    return !(d.indexOf("非全场") >= 0 || d.indexOf("opening act") >= 0);
  }

  function statsSongEntries(live) {
    const entries = (live.setlist || []).filter(statsIsCountedSong);
    return entries.map((e, i) => {
      const meta = statsSongMeta(e.title);
      const title = meta ? meta.name_jp : (e.title || "").trim();
      return {
        title: title,
        songId: statsNormId(title),
        position: i + 1,
        isOpener: i === 0,
        isCloser: i === entries.length - 1,
        isDebut: /debut|unreleased/i.test(e.highlight_label || ""),
        meta: meta
      };
    });
  }

  function computeStats() {
    const scoped = statsScopedLives().slice().sort((a, b) => parseDateStamp(a.date) - parseDateStamp(b.date));
    const complete = scoped.filter(statsCompleteSetlist);
    const months = {};
    const songMap = {};
    const liveSongs = [];

    scoped.forEach(live => {
      const mk = statsMonthKey(live.date);
      if (mk) months[mk] = (months[mk] || 0) + 1;
    });

    complete.forEach(live => {
      const entries = statsSongEntries(live);
      const stamp = parseDateStamp(live.date);
      liveSongs.push({ live: live, entries: entries, stamp: stamp });
      entries.forEach(e => {
        let sm = songMap[e.songId];
        if (!sm) {
          sm = { songId: e.songId, title: e.title, meta: e.meta, count: 0, firstStamp: stamp, firstDate: live.date, firstLiveName: live.name,
                 lastStamp: stamp, lastDate: live.date, opener: 0, closer: 0, stamps: [] };
          songMap[e.songId] = sm;
        }
        sm.count++;
        if (e.isOpener) sm.opener++;
        if (e.isCloser) sm.closer++;
        if (stamp < sm.firstStamp) { sm.firstStamp = stamp; sm.firstDate = live.date; sm.firstLiveName = live.name; }
        if (stamp > sm.lastStamp) { sm.lastStamp = stamp; sm.lastDate = live.date; }
        sm.stamps.push(stamp);
      });
    });

    const songList = Object.keys(songMap).map(k => songMap[k]);
    songList.forEach(sm => {
      sm.stamps.sort((a, b) => a - b);
      const d = STATS_DEBUT[sm.songId];
      sm.debutStamp = d ? d.stamp : sm.firstStamp;
    });

    const combos = {};
    complete.forEach(live => {
      const entries = statsSongEntries(live);
      for (let i = 0; i < entries.length - 1; i++) {
        const key = entries[i].title + " → " + entries[i + 1].title;
        combos[key] = (combos[key] || 0) + 1;
      }
    });

    return { scoped: scoped, complete: complete, songMap: songMap, songList: songList, liveSongs: liveSongs, combos: combos, months: months };
  }

  function statsCountSort(a, b) {
    if (b.count !== a.count) return b.count - a.count;
    if (b.lastStamp !== a.lastStamp) return b.lastStamp - a.lastStamp;
    if (a.firstStamp !== b.firstStamp) return a.firstStamp - b.firstStamp;
    return a.songId < b.songId ? -1 : (a.songId > b.songId ? 1 : 0);
  }

  // ===== 打开 / 关闭 =====
  function openStats() {
    const overlay = document.getElementById("statsOverlay");
    overlay.classList.add("active");
    document.body.style.overflow = "hidden";
    document.getElementById("statsBody").scrollTop = 0;
    renderStats();
  }
  function closeStats() {
    document.getElementById("statsOverlay").classList.remove("active");
    document.body.style.overflow = "";
  }
  window.closeStats = closeStats;
  window.openStats = openStats;

  document.getElementById("statsCloseBtn").addEventListener("click", closeStats);
  document.getElementById("statsOverlay").addEventListener("click", function(e) {
    if (e.target === this) closeStats();
  });
  document.addEventListener("keydown", function(e) {
    if (e.key === "Escape" && document.getElementById("statsOverlay").classList.contains("active")) {
      closeStats();
    }
  });

  (function wireStatsControls() {
    const scopes = document.querySelectorAll("#statsScopes .stats-chip");
    scopes.forEach(chip => chip.addEventListener("click", function() {
      scopes.forEach(c => c.classList.remove("active"));
      this.classList.add("active");
      statsScope = this.getAttribute("data-scope");
      statsCompareA = null;
      statsCompareB = null;
      renderStats();
    }));
    const tabs = document.querySelectorAll("#statsTabs .stats-tab");
    tabs.forEach(tab => tab.addEventListener("click", function() {
      tabs.forEach(t => t.classList.remove("active"));
      this.classList.add("active");
      statsView = this.getAttribute("data-view");
      document.querySelectorAll("#statsBody .stats-view").forEach(v => {
        v.classList.toggle("active", v.id === "view-" + statsView);
      });
      document.getElementById("statsBody").scrollTop = 0;
    }));
  })();

  // ===== 渲染入口 =====
  function renderStats() {
    const body = document.getElementById("statsBody");
    if (typeof livesData === "undefined" || typeof songsData === "undefined") {
      body.innerHTML = '<div class="stats-loading">No data available</div>';
      return;
    }
    const S = computeStats();
    body.innerHTML =
      '<div class="stats-view active" id="view-overview">' + renderOverview(S) + '</div>' +
      '<div class="stats-view" id="view-evolution">' + renderEvolution(S) + '</div>' +
      '<div class="stats-view" id="view-compare">' + renderCompare(S) + '</div>' +
      '<div class="stats-view" id="view-repertoire">' + renderRepertoire(S) + '</div>';
    document.querySelectorAll("#statsBody .stats-view").forEach(v => {
      v.classList.toggle("active", v.id === "view-" + statsView);
    });
    wireCompare(S);
  }

  // ==================== OVERVIEW ====================
  function renderOverview(S) {
    const dateStart = S.scoped.length ? parseDateStamp(S.scoped[0].date) : 0;
    const dateEnd = S.scoped.length ? parseDateStamp(S.scoped[S.scoped.length - 1].date) : 0;
    const dateRange = dateStart ? (statsStampDisplay(dateStart, "/") + " — " + statsStampDisplay(dateEnd, "/")) : "—";

    const mostPlayed = S.songList.slice().sort(statsCountSort)[0];

    let longestLive = null, longestLen = 0;
    S.liveSongs.forEach(ls => { if (ls.entries.length > longestLen) { longestLen = ls.entries.length; longestLive = ls; } });

    const activeRepertoire = S.songList.length;

    let html = '<div class="metric-grid">' +
      '<article class="metric"><div class="metric-label">Recorded Lives</div><div class="metric-value red">' + S.scoped.length + '</div><div class="metric-note">' + dateRange + '</div></article>' +
      '<article class="metric"><div class="metric-label">Most Performed</div><div class="metric-value metric-value--title">' + (mostPlayed ? escapeHTML(mostPlayed.title) : "—") + '</div><div class="metric-note">全档案演出次数最多的歌曲</div></article>' +
      '<article class="metric"><div class="metric-label">Longest Setlist</div><div class="metric-value">' + longestLen + '</div><div class="metric-note">单场曲目最多的演出</div></article>' +
      '<article class="metric"><div class="metric-label">Active Repertoire</div><div class="metric-value">' + activeRepertoire + '</div><div class="metric-note">当前演出曲库中的原创曲目</div></article>' +
      '</div>';

    // Live Records
    const records = [];
    if (longestLive) records.push({ idx: "REC // 01", title: statsShortName(longestLive.live.name), note: "LONGEST SETLIST · " + longestLen + " TRACKS" });
    const debutCount = {};
    Object.keys(STATS_DEBUT).forEach(songId => {
      const d = STATS_DEBUT[songId];
      if (statsScope !== "all" && statsScopeOf(d.live) !== statsScope) return;
      const key = d.liveName || d.date;
      debutCount[key] = (debutCount[key] || 0) + 1;
    });
    let debutLiveName = "", debutMax = 0;
    Object.keys(debutCount).forEach(n => { if (debutCount[n] > debutMax) { debutMax = debutCount[n]; debutLiveName = n; } });
    if (debutMax > 0) records.push({ idx: "REC // 02", title: statsShortName(debutLiveName), note: "MOST LIVE DEBUTS · " + debutMax + " TRACKS" });
    let dormSong = null, dormDays = -1;
    S.songList.forEach(sm => {
      for (let i = 1; i < sm.stamps.length; i++) {
        const gap = statsDayDiff(sm.stamps[i - 1], sm.stamps[i]);
        if (gap > dormDays) { dormDays = gap; dormSong = sm; }
      }
    });
    if (dormSong && dormDays >= 0) records.push({ idx: "REC // 03", title: dormSong.title, note: "LONGEST DORMANCY · " + dormDays + " DAYS" });
    let shiftMax = -1, shiftLive = null;
    for (let i = 1; i < S.liveSongs.length; i++) {
      const a = new Set(S.liveSongs[i - 1].entries.map(e => e.songId));
      const b = new Set(S.liveSongs[i].entries.map(e => e.songId));
      let common = 0;
      a.forEach(x => { if (b.has(x)) common++; });
      const uni = new Set([...a, ...b]);
      const dist = uni.size ? (1 - common / uni.size) : 0;
      if (dist > shiftMax) { shiftMax = dist; shiftLive = S.liveSongs[i].live; }
    }
    if (shiftLive) records.push({ idx: "REC // 04", title: statsShortName(shiftLive.name), note: "LARGEST SETLIST SHIFT · " + Math.round(shiftMax * 100) + "%" });

    if (records.length) {
      html += '<section class="section">' +
        '<div class="section-head"><div><div class="kicker">ARCHIVE RECORDS</div><h2>Live Records</h2></div><div class="section-note">演出级纪录集中置顶；筛选演出类型后，纪录和下方数据同步更新。</div></div>' +
        '<div class="records">' + records.map(r =>
          '<article class="record"><div class="record-index">' + r.idx + '</div><strong>' + escapeHTML(r.title) + '</strong><span>' + escapeHTML(r.note) + '</span></article>'
        ).join("") + '</div></section>';
    }

    // Most Played Songs
    const topSongs = S.songList.slice().sort(statsCountSort).slice(0, 10);
    const maxCount = topSongs.length ? topSongs[0].count : 1;
    html += '<div class="two-col">';
    html += '<section class="section"><div class="section-head"><div><div class="kicker">TRACK FREQUENCY</div><h2>Most Played Songs</h2></div></div><div class="bars">' +
      topSongs.map(sm => '<div class="bar-row"><div class="bar-name" title="' + statsAttr(sm.title) + '">' + escapeHTML(sm.title) + '</div><div class="bar-track"><div class="bar-fill" style="width:' + Math.round(sm.count / maxCount * 100) + '%"></div></div><div class="bar-count">' + sm.count + '</div></div>').join("") +
      '</div></section>';

    // Openers & Closers
    const topOpeners = S.songList.slice().filter(x => x.opener > 0).sort((a, b) => b.opener - a.opener || statsCountSort(a, b)).slice(0, 5);
    const topClosers = S.songList.slice().filter(x => x.closer > 0).sort((a, b) => b.closer - a.closer || statsCountSort(a, b)).slice(0, 5);
    const openerItems = topOpeners.length ? topOpeners.map(x => '<li><span>' + escapeHTML(x.title) + '</span><span class="count">' + x.opener + '</span></li>').join("") : '<li class="stats-empty-note">NO DATA</li>';
    const closerItems = topClosers.length ? topClosers.map(x => '<li><span>' + escapeHTML(x.title) + '</span><span class="count">' + x.closer + '</span></li>').join("") : '<li class="stats-empty-note">NO DATA</li>';
    html += '<section class="section"><div class="section-head"><div><div class="kicker">POSITION FREQUENCY</div><h2>Openers &amp; Closers</h2></div></div><div class="split-list">' +
      '<div><h3>[ OPENER ]</h3><ul class="data-list">' + openerItems + '</ul></div>' +
      '<div><h3>[ CLOSER ]</h3><ul class="data-list">' + closerItems + '</ul></div>' +
      '</div></section>';
    html += '</div>';

    // Frequent Combos
    const topCombos = Object.entries(S.combos).sort((a, b) => b[1] - a[1]).slice(0, 8);
    html += '<section class="section"><div class="section-head"><div><div class="kicker">SEQUENCE PATTERNS</div><h2>Frequent Combos</h2></div><div class="section-note">相邻出现次数最多的歌曲组合，用于观察固定衔接和 Setlist 编排习惯。</div></div>' +
      (topCombos.length ? '<ul class="data-list">' + topCombos.map(c => '<li><span>' + escapeHTML(c[0].split(" → ")[0]) + ' <b class="combo-arrow">→</b> ' + escapeHTML(c[0].split(" → ")[1]) + '</span><span class="count">' + c[1] + '</span></li>').join("") + '</ul>' : '<p class="stats-empty-note">NO DATA</p>') +
      '</section>';

    // Activity Heatmap
    html += renderHeatmap(S);

    return html;
  }

  function renderHeatmap(S) {
    const STATS_MONTHS = ["01","02","03","04","05","06","07","08","09","10","11","12"];
    const years = {};
    Object.keys(S.months).forEach(mk => { years[mk.slice(0, 4)] = true; });
    const yearList = Object.keys(years).sort();
    let cells = '<span></span>' + STATS_MONTHS.map(m => '<span class="label">' + m + '</span>').join("");
    yearList.forEach(y => {
      cells += '<span class="year">' + y + '</span>';
      STATS_MONTHS.forEach(m => {
        const c = S.months[y + "-" + m] || 0;
        const lvl = c === 0 ? 0 : (c === 1 ? 1 : (c === 2 ? 2 : (c === 3 ? 3 : 4)));
        cells += '<span class="heat l' + lvl + '" title="' + y + "." + m + " · " + c + ' LIVE' + (c === 1 ? "" : "S") + '"></span>';
      });
    });
    return '<section class="section"><div class="section-head"><div><div class="kicker">ACTIVITY BY MONTH</div><h2>Activity Heatmap</h2></div><div class="section-note">颜色表达当月演出次数；悬停格子显示数值。</div></div>' +
      '<div class="heatmap-wrap"><div class="heatmap">' + cells + '</div></div></section>';
  }

  // ==================== EVOLUTION ====================
  function renderEvolution(S) {
    const cols = S.liveSongs;
    const rows = S.songList.slice().sort(function(a, b) {
      if (a.debutStamp !== b.debutStamp) return a.debutStamp - b.debutStamp;
      const ra = (a.meta && a.meta.release_date) ? parseDateStamp(a.meta.release_date) : 0;
      const rb = (b.meta && b.meta.release_date) ? parseDateStamp(b.meta.release_date) : 0;
      if (ra !== rb) return (ra || 99999999) - (rb || 99999999);
      return a.songId < b.songId ? -1 : (a.songId > b.songId ? 1 : 0);
    });

    if (!cols.length) {
      return '<section class="section"><div class="section-head"><div><div class="kicker">SETLIST CHRONOLOGY</div><h2>Setlist Evolution</h2></div></div><p class="stats-empty-note">当前范围无可用于矩阵的完整 Setlist 数据。</p></section>';
    }

    let head = '<thead><tr><th>SONG / LIVE</th>';
    cols.forEach(ls => {
      head += '<th title="' + statsAttr(ls.live.name + " · " + statsStampDisplay(ls.stamp, "/")) + '">' + statsAttr(ls.live.for_short || statsShortName(ls.live.name)) + '</th>';
    });
    head += '</tr></thead>';

    let tbody = '<tbody>';
    rows.forEach(song => {
      tbody += '<tr><td title="' + statsAttr(song.title) + '">' + escapeHTML(song.title) + '</td>';
      cols.forEach(ls => {
        const entry = ls.entries.find(e => e.songId === song.songId);
        if (!entry) { tbody += '<td></td>'; return; }
        const debut = ls.stamp === song.debutStamp;
        const cls = (debut ? 'debut' : 'played') + (entry.isOpener ? ' opener' : '') + (entry.isCloser ? ' closer' : '');
        const label = debut ? 'D' : String(entry.position);
        const tip = ls.live.name + " · " + statsStampDisplay(ls.stamp, "/") + "\n" + song.title + "\n" + (debut ? 'LIVE DEBUT' : ('POSITION ' + entry.position)) + (entry.isOpener ? ' · OPENER' : '') + (entry.isCloser ? ' · CLOSER' : '');
        tbody += '<td class="' + cls + '" title="' + statsAttr(tip) + '">' + label + '</td>';
      });
      tbody += '</tr>';
    });
    tbody += '</tbody>';

    return '<section class="section">' +
      '<div class="section-head"><div><div class="kicker">SETLIST CHRONOLOGY</div><h2>Setlist Evolution</h2></div><div class="section-note">横轴为演出，纵轴为歌曲。D 为首次演奏，红色斜纹为开场曲，白色斜纹为收尾曲。</div></div>' +
      '<div class="matrix-tools"><div class="legend"><span><b>D</b> LIVE DEBUT</span><span><b class="swt swt-open"></b> OPENER</span><span><b class="swt swt-close"></b> CLOSER</span><span><b>01—</b> SETLIST POSITION</span></div><div class="stats-file-id">' + rows.length + ' TRACKS × ' + cols.length + ' LIVES</div></div>' +
      '<div class="matrix-scroll"><table class="matrix">' + head + tbody + '</table></div>' +
      '</section>';
  }

  // ==================== COMPARE ====================
  function renderCompare(S) {
    if (!S.liveSongs.length) {
      return '<section class="section"><div class="section-head"><div><div class="kicker">PAIR ANALYSIS</div><h2>Live Comparison</h2></div></div><p class="stats-empty-note">当前范围无可用于对比的完整 Setlist 数据。</p></section>';
    }
    const opts = S.liveSongs.map((ls, i) => '<option value="' + i + '">' + escapeHTML(statsStampDisplay(ls.stamp, "/") + " · " + statsShortName(ls.live.name) + (ls.live.venue ? " · " + ls.live.venue : "")) + '</option>').join("");
    return '<section class="section">' +
      '<div class="section-head"><div><div class="kicker">PAIR ANALYSIS</div><h2>Live Comparison</h2></div><div class="section-note">适合比较双日公演、巡演不同地区，以及专场与音乐节版本的差异。</div></div>' +
      '<div class="select-row"><label>Archive A<select id="statsSelectA">' + opts + '</select></label><div class="versus">VS</div><label>Archive B<select id="statsSelectB">' + opts + '</select></label></div>' +
      '<div class="comparison-metrics">' +
      '<div class="mini-metric"><b id="statsSim">—</b><span>SETLIST SIMILARITY</span></div>' +
      '<div class="mini-metric"><b id="statsCommon">—</b><span>COMMON TRACKS</span></div>' +
      '<div class="mini-metric"><b id="statsOnlyACount">—</b><span>ARCHIVE A ONLY</span></div>' +
      '<div class="mini-metric"><b id="statsOnlyBCount">—</b><span>ARCHIVE B ONLY</span></div>' +
      '</div>' +
      '<div class="compare-columns"><div class="compare-col"><h3>[ A ONLY ]</h3><ul id="statsOnlyA"></ul></div><div class="compare-col common"><h3>[ SHARED REPERTOIRE ]</h3><ul id="statsShared"></ul></div><div class="compare-col"><h3>[ B ONLY ]</h3><ul id="statsOnlyB"></ul></div></div>' +
      '</section>';
  }

  function wireCompare(S) {
    const selA = document.getElementById("statsSelectA");
    const selB = document.getElementById("statsSelectB");
    if (!selA || !selB) return;
    if (statsCompareA === null || statsCompareA >= S.liveSongs.length) statsCompareA = 0;
    if (statsCompareB === null || statsCompareB >= S.liveSongs.length) statsCompareB = S.liveSongs.length >= 2 ? S.liveSongs.length - 1 : 0;
    if (statsCompareA === statsCompareB && S.liveSongs.length >= 2) statsCompareB = 1;
    selA.value = String(statsCompareA);
    selB.value = String(statsCompareB);
    const update = function() {
      statsCompareA = parseInt(selA.value, 10);
      statsCompareB = parseInt(selB.value, 10);
      updateCompare(S);
    };
    selA.addEventListener("change", update);
    selB.addEventListener("change", update);
    updateCompare(S);
  }

  function updateCompare(S) {
    const A = S.liveSongs[statsCompareA];
    const B = S.liveSongs[statsCompareB];
    if (!A || !B) return;
    const aEntries = A.entries, bEntries = B.entries;
    const bSet = new Set(bEntries.map(e => e.songId));
    const aSet = new Set(aEntries.map(e => e.songId));
    const common = [], onlyA = [], onlyB = [];
    const seenCommon = new Set();
    aEntries.forEach(e => {
      if (bSet.has(e.songId)) {
        if (!seenCommon.has(e.songId)) {
          seenCommon.add(e.songId);
          const bEntry = bEntries.find(x => x.songId === e.songId);
          common.push({ title: e.title, aPos: e.position, bPos: bEntry ? bEntry.position : 0 });
        }
      } else if (!onlyA.some(x => x.title === e.title)) {
        onlyA.push({ title: e.title });
      }
    });
    bEntries.forEach(e => {
      if (!aSet.has(e.songId) && !onlyB.some(x => x.title === e.title)) onlyB.push({ title: e.title });
    });
    const union = new Set([...aSet, ...bSet]);
    const similarity = union.size ? Math.round(common.length / union.size * 100) : 0;
    document.getElementById("statsSim").textContent = similarity + "%";
    document.getElementById("statsCommon").textContent = common.length;
    document.getElementById("statsOnlyACount").textContent = onlyA.length;
    document.getElementById("statsOnlyBCount").textContent = onlyB.length;
    const pad = n => String(n).padStart(2, "0");
    document.getElementById("statsOnlyA").innerHTML = onlyA.length ? onlyA.map(x => '<li>' + escapeHTML(x.title) + '</li>').join("") : '<li>NO EXCLUSIVE TRACKS</li>';
    document.getElementById("statsShared").innerHTML = common.length ? common.map(x => '<li><span>' + escapeHTML(x.title) + '</span><small>A:' + pad(x.aPos) + ' / B:' + pad(x.bPos) + '</small></li>').join("") : '<li>NO SHARED TRACKS</li>';
    document.getElementById("statsOnlyB").innerHTML = onlyB.length ? onlyB.map(x => '<li>' + escapeHTML(x.title) + '</li>').join("") : '<li>NO EXCLUSIVE TRACKS</li>';
  }

  // ==================== REPERTOIRE ====================
  function computeStreaks(S) {
    const result = [];
    S.songList.forEach(sm => {
      const seq = S.liveSongs.map(ls => ls.entries.some(e => e.songId === sm.songId));
      let longest = 0, cur = 0;
      seq.forEach(v => { if (v) { cur++; if (cur > longest) longest = cur; } else { cur = 0; } });
      let current = 0;
      for (let i = seq.length - 1; i >= 0; i--) { if (seq[i]) current++; else break; }
      const total = seq.filter(Boolean).length;
      result.push({ song: sm, seq: seq, longest: longest, current: current, total: total });
    });
    return result;
  }

  function renderRepertoire(S) {
    const today = statsTodayStamp();
    const playedIds = new Set(S.songList.map(x => x.songId));
    const unplayed = songsData.filter(s => {
      const rs = s.release_date ? parseDateStamp(s.release_date) : 0;
      return statsIsOriginal(s) && rs > 0 && rs <= today && s.name_jp && !playedIds.has(statsNormId(s.name_jp));
    }).sort((a, b) => parseDateStamp(a.release_date) - parseDateStamp(b.release_date));

    const dormant = S.songList.filter(sm => statsDayDiff(sm.lastStamp, today) >= STATS_DORMANT_DAYS)
      .slice().sort((a, b) => a.lastStamp - b.lastStamp);

    const streaks = computeStreaks(S).filter(x => x.total > 0)
      .sort((a, b) => b.current - a.current || b.longest - a.longest || b.total - a.total);

    let gapSum = 0, gapCnt = 0;
    S.songList.forEach(sm => {
      const rs = sm.meta && sm.meta.release_date ? parseDateStamp(sm.meta.release_date) : 0;
      if (rs > 0) { gapSum += statsDayDiff(rs, sm.debutStamp); gapCnt++; }
    });
    const avgGap = gapCnt ? Math.round(gapSum / gapCnt) : null;

    const longestCurrent = streaks.length ? streaks[0] : null;

    let html = '<div class="comparison-metrics" style="margin-top:20px">' +
      '<div class="mini-metric"><b>' + unplayed.length + '</b><span>UNPLAYED TRACKS</span></div>' +
      '<div class="mini-metric"><b>' + dormant.length + '</b><span>DORMANT TRACKS</span></div>' +
      '<div class="mini-metric"><b>' + (longestCurrent ? longestCurrent.current + " LIVE" : "0") + '</b><span>LONGEST CURRENT STREAK</span></div>' +
      '<div class="mini-metric"><b>' + (avgGap === null ? "—" : avgGap + "d") + '</b><span>AVERAGE DEBUT GAP</span></div>' +
      '</div>';

    // Release → Live Debut
    html += '<section class="section"><div class="section-head"><div><div class="kicker">RELEASE / PERFORMANCE GAP</div><h2>Release → LIVE DEBUT</h2></div><div class="section-note">从初次公布到首次登台的间隔时间</div></div><div class="matrix-scroll"><table class="debut-table">' +
      '<thead><tr><th>SONG</th><th>RELEASE</th><th>LIVE DEBUT</th><th>GAP</th><th>RELATIVE POSITION</th></tr></thead><tbody>';

    const debutSorted = songsData.filter(statsIsOriginal).sort((a, b) => {
      const ra = a.release_date ? parseDateStamp(a.release_date) : 0;
      const rb = b.release_date ? parseDateStamp(b.release_date) : 0;
      if (ra !== rb) return (ra || 99999999) - (rb || 99999999);
      return (a.name_jp || "") < (b.name_jp || "") ? -1 : 1;
    });

    debutSorted.forEach(s => {
      const rs = s.release_date ? parseDateStamp(s.release_date) : 0;
      const d = STATS_DEBUT[statsNormId(s.name_jp)];
      const debutStamp = d ? d.stamp : null;
      let gap = null, delta = "", cls = "";
      if (!rs) { delta = "RELEASE DATE UNKNOWN"; cls = "never"; }
      else if (!debutStamp) { delta = "NOT PERFORMED"; cls = "never"; }
      else {
        gap = statsDayDiff(rs, debutStamp);
        if (gap < 0) { delta = gap + " DAYS · LIVE FIRST"; cls = "early"; }
        else if (gap === 0) { delta = "SAME DAY"; }
        else { delta = "+" + gap + " DAYS"; }
      }
      // 时间轴
      let left = 48, width = 0;
      if (gap !== null) {
        const scale = 8;
        width = Math.min(48, Math.max(2, Math.abs(gap) / scale));
        if (gap < 0) left = Math.max(0, 48 - width);
        else left = 48;
      }
      const fillStyle = gap === null ? "" : ('left:' + left + '%;width:' + width + '%');
      html += '<tr><td>' + escapeHTML(s.name_jp) + '</td><td>' + (rs ? escapeHTML(statsStampDisplay(rs, "/")) : "—") + '</td>' +
        '<td>' + (debutStamp ? escapeHTML(statsStampDisplay(debutStamp, "/")) : "—") + '</td>' +
        '<td class="delta ' + cls + '">' + escapeHTML(delta) + '</td>' +
        '<td class="timeline-cell"><div class="time-track"><span class="time-fill" style="' + fillStyle + '"></span></div></td></tr>';
    });
    html += '</tbody></table></div></section>';

    // Rarities & Unplayed
    const dormantItems = dormant.length ? dormant.map(sm => {
      const days = statsDayDiff(sm.lastStamp, today);
      return '<li><span>' + escapeHTML(sm.title) + '<small>LAST · ' + escapeHTML(statsStampDisplay(sm.lastStamp, "/")) + '</small></span><span class="count">' + days + 'd</span></li>';
    }).join("") : '<li class="stats-empty-note">NO DORMANT TRACKS</li>';
    const unplayedItems = unplayed.length ? unplayed.map(s => '<li><span>' + escapeHTML(s.name_jp) + '<small>RELEASE · ' + escapeHTML(statsStampDisplay(parseDateStamp(s.release_date), "/")) + '</small></span></li>').join("") : '<li class="stats-empty-note">NO UNPLAYED TRACKS</li>';
    html += '<section class="section"><div class="section-head"><div><div class="kicker">RARE &amp; ABSENT</div><h2>Rarities &amp; Unplayed Tracks</h2></div><div class="section-note">从尚未登台到长期休眠，集中查看目前不属于常规演出曲库的歌曲。</div></div>' +
      '<div class="split-list"><div><h3>[ DORMANT ]</h3><ul class="data-list">' + dormantItems + '</ul></div><div><h3>[ UNPLAYED ]</h3><ul class="data-list">' + unplayedItems + '</ul></div></div></section>';

    // Song Streaks
    const streakList = streaks.slice(0, 16);
    let streakHTML = "";
    if (!streakList.length) {
      streakHTML = '<p class="stats-empty-note">当前范围无可用于 Streak 统计的完整 Setlist 数据。</p>';
    } else {
      streakHTML = '<div class="streak-list">' + streakList.map(st => {
        const trackStyle = 'style="grid-template-columns:repeat(' + st.seq.length + ',1fr)"';
        const cells = st.seq.map((v, i) => {
          let c = "";
          if (v) c = (st.current > 0 && i >= st.seq.length - st.current) ? 'hot' : 'on';
          const ls = S.liveSongs[i];
          const tip = (ls ? (ls.live.name + " · " + statsStampDisplay(ls.stamp, "/")) : "") + (v ? " · 演奏" : " · 未演奏");
          return '<i class="' + c + '" title="' + statsAttr(tip) + '"></i>';
        }).join("");
        return '<div class="streak-row"><div class="streak-name">' + escapeHTML(st.song.title) + '</div><div class="streak-number">CUR <b>' + st.current + '</b> · MAX <b>' + st.longest + '</b></div><div class="streak-track" ' + trackStyle + '>' + cells + '</div></div>';
      }).join("") + '</div>';
    }
    html += '<section class="section"><div class="section-head"><div><div class="kicker">CONSECUTIVE APPEARANCES</div><h2>Song Streaks</h2></div><div class="section-note">每格代表一场完整演出。暗红为演奏，亮红为当前连续纪录，空格为缺席。</div></div>' + streakHTML + '</section>';

    return html;
  }
})();
  </script>
</body>
</html>
