<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../favicon.ico">
  <title>Gallery · 唯鸡百科</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@700&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=202609232325">
  <link rel="stylesheet" href="../css/local-search.css?v=202609232325">
  <link rel="stylesheet" href="../css/quick-nav.css?v=202609232325">
</head>
<body>
  <div class="gallery-page">
    <header class="page-header">
      <a href="../index.html" class="back-nav" aria-label="返回主页">&larr;Home</a>
      <h1>Gallery</h1>
    </header>

    <div class="filter-bar" id="filterBar">
        <!-- 由 JS 动态生成 -->
      </div>

      <div class="gallery-toolbar">
        <div class="search-box">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="gallerySearchInput" type="search" placeholder="搜索画廊…" autocomplete="off">
        </div>
        <span class="result-count" id="galleryResultCount"></span>
      </div>

      <div class="masonry-grid" id="masonryGrid">
        <!-- 由 JS 动态生成 -->
      </div>

      <div class="pagination-bar" id="paginationBar"></div>

  <!-- 灯箱 -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">&times;</button>
    <img class="lightbox-img" id="lightboxImg" src="" alt="">
    <div class="lightbox-info">
      <div class="lightbox-date" id="lightboxDate"></div>
      <div class="lightbox-title" id="lightboxTitle"></div>
      <div class="lightbox-desc" id="lightboxDesc"></div>
    </div>
  </div>

  <!-- 返回顶部按钮 -->
  <button class="page-top-btn" id="pageTopBtn">↑Page Top</button>

  <script src="data.js?v=202609232325"></script>
  <script src="page.js?v=202609232325"></script>
  <script src="../js/quick-nav.js?v=202609232325"></script>
  <script src="../js/page-memory.js?v=202609232325"></script>
  </div>
</body>
</html>
