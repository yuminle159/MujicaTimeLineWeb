<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../favicon.ico">
  <title>Timeline · 唯鸡百科</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=202609242328">
  <link rel="stylesheet" href="../css/local-search.css?v=202609242328">
  <link rel="stylesheet" href="../css/quick-nav.css?v=202609242328">
</head>
<body>
  <!-- 星空背景（固定在视口后方，随滚动产生视差） -->
  <div class="stardust-bg" aria-hidden="true">
    <div class="stardust-layer" id="stars-base"></div>
    <div class="stardust-layer" id="stars-mid"></div>
    <div class="stardust-layer" id="stars-blink-slow"></div>
    <div class="stardust-layer" id="stars-blink-fast"></div>
    <!-- 少量大颗“尖头十字”亮星，带朦胧光晕 -->
    <div class="stardust-sparkles" id="stardustSparkles"></div>
  </div>

  <div class="timeline-page">
    <header class="page-header">
      <a href="../index.html" class="back-nav" aria-label="返回主页">&larr;Home</a>
      <h1>TimeLine</h1>
      <p>Band &amp; Nonrico</p>
    </header>

    <!-- 标签筛选器 -->
    <div class="filter-bar" id="filterBar">
      <div class="filter-tags" id="filterTags"></div>
      <div class="search-box timeline-search-box">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="timelineSearchInput" type="search" placeholder="搜索时间线…" autocomplete="off">
      </div>
      <span class="result-count" id="timelineResultCount"></span>
    </div>
    <!-- 年份筛选器 -->
    <div class="filter-bar year-filter-bar" id="yearFilterBar" style="padding-top:0;"></div>

    <div class="timeline-wrapper" id="timelineWrapper">
      <!-- 左侧月度刻度 -->
      <div class="ticks-left" id="ticksLeft"></div>
      <!-- 右侧月度刻度 -->
      <div class="ticks-right" id="ticksRight"></div>

      <!-- 左侧：组织 -->
      <div class="track track-left" id="trackLeft"></div>

      <!-- 右侧：个人 -->
      <div class="track track-right" id="trackRight"></div>
    </div>
  </div>

  <!-- 详情模态框 -->
  <div class="tl-modal-overlay" id="tlModalOverlay">
    <div class="tl-modal-container">
      <button class="tl-modal-close" id="tlModalClose">&times;</button>
      <div class="tl-modal-body" id="tlModalBody"></div>
    </div>
  </div>

  <!-- 图片灯箱 -->
  <div id="tlLightbox" class="tl-lightbox">
    <button class="tl-lightbox-close">&times;</button>
    <button class="tl-lightbox-arrow tl-lightbox-prev">&#10094;</button>
    <div class="tl-lightbox-images" id="tlLightboxImages"></div>
    <span class="tl-lightbox-counter" id="tlLightboxCounter"></span>
    <button class="tl-lightbox-arrow tl-lightbox-next">&#10095;</button>
  </div>

  <!-- 返回顶部按钮 -->
  <button class="page-top-btn" id="pageTopBtn">↑Page Top</button>

  <script src="../js/resource-error.js?v=202609242328"></script>
  <script src="data.js?v=202609242328"></script>
  <script src="page.js?v=202609242328"></script>
  <script src="../js/quick-nav.js?v=202609242328"></script>
  <script src="../js/page-memory.js?v=202609242328"></script>
</body>
</html>
